    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-up': 'scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 4s ease-in-out infinite',
                        'pulse-glow-amber': 'pulseGlowAmber 2.5s infinite',
                        'pulse-glow-rose': 'pulseGlowRose 2s infinite',
                        'pulse-glow-indigo': 'pulseGlowIndigo 3s infinite',
                        'heartbeat': 'heartbeat 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 12s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleUp: { '0%': { opacity: '0', transform: 'scale(0.95)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
                        pulseGlowAmber: { '0%, 100%': { boxShadow: '0 0 15px rgba(245,158,11,0.2)' }, '50%': { boxShadow: '0 0 35px rgba(245,158,11,0.6)' } },
                        pulseGlowRose: { '0%, 100%': { boxShadow: '0 0 15px rgba(225,29,72,0.2)' }, '50%': { boxShadow: '0 0 35px rgba(225,29,72,0.6)' } },
                        pulseGlowIndigo: { '0%, 100%': { boxShadow: '0 0 15px rgba(99,102,241,0.2)' }, '50%': { boxShadow: '0 0 40px rgba(99,102,241,0.7)' } },
                        heartbeat: { '0%, 100%': { transform: 'scale(1)', opacity: '1' }, '50%': { transform: 'scale(1.08)', opacity: '0.8' } },
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap');
        
        body { 
            background-color: #010308; 
            color: #f8fafc; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
            font-family: 'Outfit', sans-serif;
        }
        
        .font-tech { font-family: 'Space Grotesk', sans-serif; }

        button { touch-action: manipulation; outline: none; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .omni-glass {
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(32px) saturate(120%);
            -webkit-backdrop-filter: blur(32px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .omni-card {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .omni-card:hover {
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        //        const playOmniSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                
                const createOsc = (type, freq, vStart, vEnd, dur) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(vStart, now);
                    gain.gain.exponentialRampToValueAtTime(vEnd, now + dur);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                };

                switch (type) {
                    case 'hologram':
                        createOsc('sine', 880, 0.05, 0.001, 0.1);
                        createOsc('sine', 1760, 0.02, 0.001, 0.15);
                        break;
                    case 'select':
                        createOsc('square', 320, 0.03, 0.001, 0.08);
                        break;
                    case 'danger':
                        createOsc('sawtooth', 120, 0.1, 0.001, 0.3);
                        createOsc('square', 60, 0.1, 0.001, 0.3);
                        break;
                    case 'night_start':
                        createOsc('sine', 220, 0.1, 0.001, 2);
                        createOsc('sine', 110, 0.1, 0.001, 2);
                        break;
                    case 'victory':
                        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                            setTimeout(() => createOsc('sine', f, 0.1, 0.001, 0.5), i * 150);
                        });
                        break;
                }
            } catch(e) {}
        };

        const haptic = (intensity = 'light') => {
            if (!navigator.vibrate) return;
            try {
                if (intensity === 'light') navigator.vibrate(10);
                if (intensity === 'medium') navigator.vibrate(25);
                if (intensity === 'heavy') navigator.vibrate([40, 30, 40]);
                if (intensity === 'pulse') navigator.vibrate([15, 50, 15, 50, 15]);
            } catch(e) {}
        };

        //        const iconsPaths = {
            Shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',

            Clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
            Flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'
        };

        const Icon = ({ name, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: iconsPaths[name] }} />
        );

        //        const ROLES = {
            CITIZEN: { id: 'CITIZEN', name: 'Мирный', color: 'text-slate-300', bg: 'bg-slate-500/10', border: 'border-slate-500/30', glow: 'shadow-slate-500/20' },
            MAFIA: { id: 'MAFIA', name: 'Мафия', color: 'text-rose-400', bg: 'bg-rose-500/10', border: 'border-rose-500/40', glow: 'shadow-rose-500/30' },
            DON: { id: 'DON', name: 'Дон', color: 'text-red-500', bg: 'bg-red-600/15', border: 'border-red-600/40', glow: 'shadow-red-600/30' },
            SHERIFF: { id: 'SHERIFF', name: 'Шериф', color: 'text-amber-400', bg: 'bg-amber-500/10', border: 'border-amber-500/40', glow: 'shadow-amber-500/30' },
            DOCTOR: { id: 'DOCTOR', name: 'Доктор', color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/40', glow: 'shadow-emerald-500/30' },
            MANIAC: { id: 'MANIAC', name: 'Маньяк', color: 'text-orange-400', bg: 'bg-orange-500/10', border: 'border-orange-500/40', glow: 'shadow-orange-500/30' },
            BEAUTY: { id: 'BEAUTY', name: 'Красотка', color: 'text-fuchsia-400', bg: 'bg-fuchsia-500/10', border: 'border-fuchsia-500/40', glow: 'shadow-fuchsia-500/30' },
        };

        const PHASES = { SETUP: 'SETUP', DAY: 'DAY', VOTING: 'VOTING', NIGHT: 'NIGHT', BRIEFING: 'BRIEFING', GAME_OVER: 'GAME_OVER' };

        //        function MafiaOS() {
            const [phase, setPhase] = useState(PHASES.SETUP);
            const [dayCount, setDayCount] = useState(1);
            const [players, setPlayers] = useState([]);
            const [deck, setDeck] = useState({
                total: 10,
                roles: { MAFIA: 2, DON: 1, SHERIFF: 1, DOCTOR: 0, MANIAC: 0, BEAUTY: 0, CITIZEN: 6 }
            });

            const [nominations, setNominations] = useState([]);
            const [votes, setVotes] = useState({});
            const [nightActions, setNightActions] = useState({});
            const [nightStep, setNightStep] = useState(0);
            const [briefingData, setBriefingData] = useState(null);
            const [winner, setWinner] = useState(null);
            const [speakerId, setSpeakerId] = useState(null);
            
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [showLog, setShowLog] = useState(false);
            const [gameLog, setGameLog] = useState([]);

            const [timeLeft, setTimeLeft] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const timerRef = useRef(null);
            const maxTimeRef = useRef(60);
            
            const [history, setHistory] = useState([]);

            const triggerSound = (type) => { if (soundEnabled) playOmniSound(type); };

            const logEvent = (text, type = 'info') => {
                const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                setGameLog(prev => [{ id: Date.now() + Math.random(), day: dayCount, text, type, time }, ...prev]);
            };

            const saveToHistory = () => {
                const currentState = JSON.stringify({ phase, dayCount, players, nominations, votes, nightActions, nightStep, briefingData, winner, gameLog });
                setHistory(prev => [...prev.slice(-40), currentState]);
            };

            const undo = () => {
                if (history.length === 0) return;
                haptic('medium');
                triggerSound('select');
                const s = JSON.parse(history[history.length - 1]);
                setPhase(s.phase); setDayCount(s.dayCount); setPlayers(s.players);
                setNominations(s.nominations); setVotes(s.votes); setNightActions(s.nightActions);
                setNightStep(s.nightStep); setBriefingData(s.briefingData); setWinner(s.winner); setGameLog(s.gameLog);
                setHistory(prev => prev.slice(0, -1));
            };

            const stats = useMemo(() => {
                const alive = players.filter(p => p.isAlive);
                const mafia = alive.filter(p => p.role === 'MAFIA' || p.role === 'DON').length;
                const city = alive.length - mafia;
                return { alive: alive.length, mafia, city, total: players.length };
            }, [players]);

            //            const checkWin = (currentPlayers) => {
                const alive = currentPlayers.filter(p => p.isAlive);
                if (alive.length === 0) return 'Ничья (Все мертвы)';
                const mafia = alive.filter(p => p.role === 'MAFIA' || p.role === 'DON').length;
                const city = alive.length - mafia;
                if (mafia === 0) return 'Победа Мирных';
                if (mafia >= city) return 'Победа Мафии';
                return null;
            };

            const autoBalance = () => {
                haptic('hologram');
                triggerSound('hologram');
                const total = deck.total;
                const mafiaCount = Math.floor(total / 3);
                const don = deck.roles.DON > 0 ? 1 : 0;
                const mafia = Math.max(0, mafiaCount - don);
                const sheriff = deck.roles.SHERIFF > 0 ? 1 : 0;
                const doctor = deck.roles.DOCTOR > 0 ? 1 : 0;
                const maniac = deck.roles.MANIAC > 0 ? 1 : 0;
                const beauty = deck.roles.BEAUTY > 0 ? 1 : 0;
                const citizens = Math.max(0, total - (mafia + don + sheriff + doctor + maniac + beauty));
                
                setDeck({ total, roles: { MAFIA: mafia, DON: don, SHERIFF: sheriff, DOCTOR: doctor, MANIAC: maniac, BEAUTY: beauty, CITIZEN: citizens } });
            };

            const startGame = () => {
                haptic('success');
                triggerSound('night_start');
                const rolePool = [];
                Object.entries(deck.roles).forEach(([role, count]) => {
                    for (let i = 0; i < count; i++) rolePool.push(role);
                });
                
                for (let i = rolePool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]];
                }

                setPlayers(rolePool.map((role, idx) => ({
                    id: idx + 1, name: `Игрок ${idx + 1}`, role, isAlive: true, isExposed: false,
                    knownToSheriff: false, knownToDon: false
                })));
                setPhase(PHASES.DAY);
                setDayCount(1);
                setWinner(null);
                setHistory([]);
                setGameLog([]);
                logEvent('Сессия открыта. Город просыпается.', 'system');
            };

            const handleNameChange = (id, newName) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            const cyclePlayerStatus = (id) => {
                haptic('heavy');
                triggerSound('danger');
                setPlayers(prev => prev.map(p => {
                    if (p.id !== id) return p;
                    const nextAlive = !p.isAlive;
                    logEvent(`${p.name} (ID: ${p.id}) статус изменен: ${nextAlive ? 'Ожил' : 'Убит'}`, nextAlive ? 'success' : 'danger');
                    return { ...p, isAlive: nextAlive };
                }));
            };

            useEffect(() => {
                if (isTimerRunning && timeLeft > 0) {
                    timerRef.current = setTimeout(() => {
                        setTimeLeft(prev => {
                            if (prev <= 10 && prev > 1) {
                                triggerSound('select');
                                haptic('light');
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (timeLeft === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    haptic('heavy');
                    triggerSound('danger');
                    setSpeakerId(null);
                }
                return () => clearTimeout(timerRef.current);
            }, [timeLeft, isTimerRunning]);

            const startTimer = (secs, spkId = null) => {
                haptic('light');
                triggerSound('hologram');
                maxTimeRef.current = secs;
                setTimeLeft(secs);
                setIsTimerRunning(true);
                if (spkId) setSpeakerId(spkId);
            };

            const toggleSpeaker = (id) => {
                haptic('light');
                triggerSound('select');
                if (speakerId === id) {
                    setSpeakerId(null);
                    setIsTimerRunning(false);
                } else {
                    startTimer(60, id);
                }
            };

            const toggleNomination = (playerId) => {
                haptic('medium');
                triggerSound('select');
                setNominations(prev => {
                    if (prev.includes(playerId)) return prev.filter(id => id !== playerId);
                    const p = players.find(x => x.id === playerId);
                    logEvent(`${p?.name} выставлен`, 'warning');
                    return [...prev, playerId];
                });
            };

            const endDay = () => {
                saveToHistory();
                haptic('medium');
                triggerSound('select');
                setSpeakerId(null);
                setIsTimerRunning(false);
                if (nominations.length > 0) {
                    setPhase(PHASES.VOTING);
                    const initialVotes = {};
                    nominations.forEach(id => initialVotes[id] = 0);
                    setVotes(initialVotes);
                    logEvent(`Начало суда. Выставлено: ${nominations.length}`, 'system');
                } else {
                    logEvent('Голосование не состоялось. Уход в ночь.', 'night');
                    startNight();
                }
            };

            const addVote = (playerId, delta) => {
                haptic('light');
                triggerSound('select');
                setVotes(prev => ({ ...prev, [playerId]: Math.max(0, (prev[playerId] || 0) + delta) }));
            };

            const calculateVoting = () => {
                saveToHistory();
                haptic('pulse');
                triggerSound('danger');
                const maxVotes = Math.max(...Object.values(votes));
                const leaders = Object.keys(votes).filter(id => votes[id] === maxVotes).map(Number);

                if (leaders.length === 1) {
                    const victim = players.find(p => p.id === leaders[0]);
                    const newPlayers = players.map(p => p.id === leaders[0] ? { ...p, isAlive: false, isExposed: true } : p);
                    setPlayers(newPlayers);
                    setNominations([]);
                    logEvent(`Решением города изгнан: ${victim.name} (${ROLES[victim.role].name}) [${maxVotes} гол.]`, 'danger');
                    
                    const win = checkWin(newPlayers);
                    if (win) {
                        setWinner(win);
                        triggerSound('victory');
                        logEvent(win, 'success');
                        setPhase(PHASES.GAME_OVER);
                    } else {
                        startNight();
                    }
                } else {
                    setNominations(leaders);
                    const newVotes = {};
                    leaders.forEach(id => newVotes[id] = 0);
                    setVotes(newVotes);
                    logEvent(`Автокатастрофа между лидерами (${maxVotes} гол.).`, 'warning');
                }
            };

            const getActiveNightRoles = () => {
                const active = [];
                const hasAlive = (roleId) => players.some(p => p.role === roleId && p.isAlive);
                
                if (hasAlive('BEAUTY')) active.push({ role: 'BEAUTY', action: 'Путана / Красотка', desc: 'Блокировка и алиби для игрока' });
                if (hasAlive('MAFIA') || hasAlive('DON')) active.push({ role: 'MAFIA_GROUP', action: 'Мафия стреляет', desc: 'Единый заказ клана' });
                if (hasAlive('MANIAC')) active.push({ role: 'MANIAC', action: 'Маньяк', desc: 'Слепая жажда убийства' });
                if (hasAlive('DOCTOR')) active.push({ role: 'DOCTOR', action: 'Доктор', desc: 'Спасение от смертельного выстрела' });
                if (hasAlive('SHERIFF')) active.push({ role: 'SHERIFF', action: 'Шериф', desc: 'Поиск представителей мафии' });
                if (hasAlive('DON')) active.push({ role: 'DON', action: 'Дон мафии', desc: 'Поиск комиссара / шерифа' });
                return active;
            };

            const nightOrder = getActiveNightRoles();

            const startNight = () => {
                setPhase(PHASES.NIGHT);
                setNightActions({});
                setNightStep(0);
                setNominations([]);
                triggerSound('night_start');
                logEvent(`Город погрузился в сон. Ночь ${dayCount}`, 'night');
            };

            const handleNightAction = (targetId) => {
                haptic('medium');
                triggerSound('select');
                const currentRole = nightOrder[nightStep].role;
                const newActions = { ...nightActions, [currentRole]: targetId };
                setNightActions(newActions);
                
                if (nightStep + 1 < nightOrder.length) setNightStep(prev => prev + 1);
                else finishNight(newActions);
            };

            const finishNight = (actions) => {
                saveToHistory();
                haptic('heavy');
                let killed = [];
                let saved = [];
                let reports = [];

                if (actions['BEAUTY']) saved.push(actions['BEAUTY']);
                if (actions['DOCTOR']) saved.push(actions['DOCTOR']);
                
                if (actions['MAFIA_GROUP'] && !saved.includes(actions['MAFIA_GROUP'])) killed.push(actions['MAFIA_GROUP']);
                if (actions['MANIAC'] && !saved.includes(actions['MANIAC'])) killed.push(actions['MANIAC']);

                let nextPlayers = [...players];

                if (actions['SHERIFF']) {
                    const p = nextPlayers.find(p => p.id === actions['SHERIFF']);
                    if(p) {
                        const isMafia = p.role === 'MAFIA' || p.role === 'DON';
                        reports.push(`ШЕРИФ: Игрок [${p.id}] ${p.name} — ${isMafia ? 'ЧЕРНЫЙ' : 'КРАСНЫЙ'}`);
                        nextPlayers = nextPlayers.map(pl => pl.id === p.id ? { ...pl, knownToSheriff: true } : pl);
                    }
                }
                if (actions['DON']) {
                    const p = nextPlayers.find(p => p.id === actions['DON']);
                    if(p) {
                        const isSheriff = p.role === 'SHERIFF';
                        reports.push(`ДОН: Игрок [${p.id}] ${p.name} — ${isSheriff ? 'ШЕРИФ' : 'МИРНЫЙ'}`);
                        nextPlayers = nextPlayers.map(pl => pl.id === p.id ? { ...pl, knownToDon: true } : pl);
                    }
                }

                const uniqueKilled = [...new Set(killed)];
                nextPlayers = nextPlayers.map(p => uniqueKilled.includes(p.id) ? { ...p, isAlive: false, isExposed: true } : p);
                setPlayers(nextPlayers);
                
                const killedNames = uniqueKilled.map(id => nextPlayers.find(p => p.id === id)?.name);
                if (killedNames.length > 0) {
                    logEvent(`Жертвы ночи: ${killedNames.join(', ')}`, 'danger');
                } else {
                    logEvent('Идеальная ночь: жертв нет.', 'success');
                }
                reports.forEach(r => logEvent(r, 'night'));

                const win = checkWin(nextPlayers);
                if (win) triggerSound('victory');
                
                setBriefingData({ killedNames, reports, gameOver: win });
                setPhase(PHASES.BRIEFING);
            };

            //            const BackgroundGrid = () => (
                <div className="fixed inset-0 pointer-events-none z-[-1] flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 bg-grid opacity-20" />
                    <div className={`absolute w-[80vw] h-[80vw] rounded-full blur-[140px] transition-colors duration-1000 opacity-20 ${phase === PHASES.NIGHT ? 'bg-indigo-900' : 'bg-indigo-600'} animate-spin-slow`} />
                    <div className={`absolute right-[-20%] bottom-[-20%] w-[60vw] h-[60vw] rounded-full blur-[100px] transition-colors duration-1000 opacity-20 ${phase === PHASES.NIGHT ? 'bg-rose-900' : 'bg-rose-600'}`} />
                </div>
            );

            return (
                <div className="min-h-screen pb-40 selection:bg-indigo-500/30 font-sans">
                    <BackgroundGrid />

                    {/* EVENT LOG DRAWER */}
                    <div className={`fixed inset-y-0 right-0 w-[400px] max-w-[90vw] omni-glass z-[200] transform transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col border-l border-white/10 ${showLog ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="p-6 border-b border-white/10 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 rounded-xl bg-indigo-500/20 text-indigo-400">
                                    <Icon name="Terminal" size={20}/>
                                </div>
                                <span className="font-tech font-bold text-lg tracking-wider uppercase">Терминал логов</span>
                            </div>
                            <button onClick={() => setShowLog(false)} className="p-2.5 rounded-xl bg-white/5 hover:bg-white/15 text-slate-400 hover:text-white transition">
                                <Icon name="X" size={20}/>
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {gameLog.length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center text-slate-500 opacity-50 space-y-4">
                                    <Icon name="Terminal" size={48} />
                                    <p className="font-tech text-sm uppercase tracking-widest">Ожидание событий...</p>
                                </div>
                            )}
                            {gameLog.map(item => (
                                <div key={item.id} className="animate-fade-in p-4 rounded-2xl omni-card flex flex-col gap-2 relative overflow-hidden group">
                                    <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${item.type === 'danger' ? 'bg-rose-500' : item.type === 'success' ? 'bg-emerald-500' : item.type === 'warning' ? 'bg-amber-500' : item.type === 'night' ? 'bg-indigo-500' : 'bg-slate-500'}`} />
                                    <div className="flex justify-between items-center text-[10px] font-tech text-slate-400 uppercase tracking-widest pl-2">
                                        <span>D:{item.day}</span>
                                        <span>{item.time}</span>
                                    </div>
                                    <div className={`font-semibold text-sm pl-2 leading-relaxed ${
                                        item.type === 'danger' ? 'text-rose-100' :
                                        item.type === 'success' ? 'text-emerald-100' :
                                        item.type === 'warning' ? 'text-amber-100' :
                                        item.type === 'night' ? 'text-indigo-200' : 'text-slate-200'
                                    }`}>
                                        {item.text}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    {showLog && <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[190] transition-opacity" onClick={() => setShowLog(false)} />}

                    <div className="max-w-[1200px] mx-auto p-3 sm:p-6 h-full flex flex-col">
                        
                        {/* 1. SETUP PHASE */}
                        {phase === PHASES.SETUP && (
                            <div className="max-w-2xl mx-auto w-full space-y-6 sm:space-y-8 pt-8 sm:pt-12 animate-fade-in">
                                <div className="text-center space-y-3 animate-slide-up">
                                    <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-xs font-bold tracking-widest uppercase">
                                        <Icon name="Sparkles" size={14} /> Quantum Engine v2
                                    </div>
                                    <h1 className="text-5xl sm:text-7xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-white via-slate-200 to-slate-500">
                                        MAFIA <span className="text-transparent bg-clip-text bg-gradient-to-br from-indigo-400 to-rose-400">OS</span>
                                    </h1>
                                </div>

                                <div className="omni-glass rounded-[2rem] p-6 sm:p-8 space-y-8 relative overflow-hidden animate-scale-up border-t-2 border-t-white/10">
                                    <div className="absolute -top-32 -right-32 w-64 h-64 bg-indigo-500/20 rounded-full blur-[60px]" />
                                    
                                    <div className="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-white/10">
                                        <div>
                                            <div className="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1">Размер лобби</div>
                                            <div className="text-3xl font-black text-white font-tech">{deck.total} ИГРОКОВ</div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="flex items-center gap-2 bg-slate-900/50 p-1.5 rounded-2xl border border-white/5">
                                                <button onClick={() => {haptic(); triggerSound('click'); setDeck(p => ({...p, total: Math.max(5, p.total - 1)}))}} className="w-12 h-12 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-xl font-bold transition">-</button>
                                                <button onClick={() => {haptic(); triggerSound('click'); setDeck(p => ({...p, total: p.total + 1}))}} className="w-12 h-12 rounded-xl bg-white/5 hover:bg-white/15 flex items-center justify-center text-xl font-bold transition">+</button>
                                            </div>
                                            <button onClick={autoBalance} className="flex items-center gap-2 px-4 py-3 rounded-2xl bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/30 text-indigo-300 font-bold transition text-sm uppercase tracking-wider">
                                                <Icon name="Wand2" size={16} /> Баланс
                                            </button>
                                        </div>
                                    </div>

                                    <div className="relative z-10 grid sm:grid-cols-2 gap-6">
                                        <div className="space-y-3">
                                            <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                                <div className="w-1.5 h-1.5 rounded-full bg-slate-400"/> База
                                            </div>
                                            {['MAFIA', 'DON', 'SHERIFF', 'CITIZEN'].map(rKey => (
                                                <div key={rKey} className="flex items-center justify-between p-3.5 rounded-2xl omni-card text-sm">
                                                    <span className={`font-bold ${ROLES[rKey].color}`}>{ROLES[rKey].name}</span>
                                                    <span className="font-tech font-black text-lg bg-slate-900/80 px-3 py-1 rounded-xl border border-white/5 shadow-inner">{deck.roles[rKey]}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="space-y-3">
                                            <div className="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                                <div className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"/> Активные
                                            </div>
                                            {['DOCTOR', 'MANIAC', 'BEAUTY'].map(rKey => (
                                                <div key={rKey} className="flex items-center justify-between p-3.5 rounded-2xl omni-card text-sm">
                                                    <span className={`font-bold ${ROLES[rKey].color}`}>{ROLES[rKey].name}</span>
                                                    <button onClick={() => {haptic(); triggerSound('hologram'); setDeck(p => ({...p, roles: {...p.roles, [rKey]: p.roles[rKey] === 0 ? 1 : 0}}))}} 
                                                        className={`w-14 h-8 rounded-full relative transition-all duration-300 border border-white/10 ${deck.roles[rKey] > 0 ? 'bg-indigo-600 shadow-[0_0_20px_rgba(79,70,229,0.5)]' : 'bg-slate-800'}`}>
                                                        <div className={`absolute top-1 left-1 w-6 h-6 bg-white rounded-full transition-transform duration-300 shadow-md ${deck.roles[rKey] > 0 ? 'translate-x-6' : ''}`} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <button onClick={startGame} className="relative z-10 w-full py-5 sm:py-6 rounded-2xl bg-white text-slate-950 font-black text-xl tracking-[0.2em] uppercase transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-[0_0_40px_rgba(255,255,255,0.2)] flex items-center justify-center gap-3 overflow-hidden group">
                                        <div className="absolute inset-0 bg-gradient-to-r from-transparent via-indigo-100 to-transparent opacity-0 group-hover:opacity-100 transition-opacity" />
                                        <span className="relative z-10">Инициализация</span>
                                        <Icon name="Play" size={24} className="relative z-10"/>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* */}
                        {/* 2. IN-GAME HEADER / HUD */}
                        {phase !== PHASES.SETUP && (
                            <div className="space-y-4 mb-6 animate-fade-in">
                                <div className="omni-glass rounded-[2rem] p-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-white/10">
                                    
                                    <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                                        <button onClick={undo} disabled={history.length === 0} className={`p-3.5 rounded-2xl transition-all ${history.length > 0 ? 'bg-white/10 hover:bg-white/20 text-white shadow-lg' : 'bg-white/5 text-slate-600'}`}>
                                            <Icon name="RotateCcw" size={20} />
                                        </button>
                                        <button onClick={() => {haptic('light'); setSoundEnabled(!soundEnabled)}} className={`p-3.5 rounded-2xl transition-all ${soundEnabled ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-white/5 text-slate-500'}`}>
                                            <Icon name={soundEnabled ? "Volume2" : "VolumeX"} size={20} />
                                        </button>
                                        <button onClick={() => setShowLog(true)} className="p-3.5 rounded-2xl bg-white/10 hover:bg-white/20 text-white transition-all shadow-lg hidden sm:block">
                                            <Icon name="Terminal" size={20} />
                                        </button>
                                    </div>

                                    <div className="text-center flex-1">
                                        <div className="text-[10px] font-black tracking-[0.3em] uppercase text-indigo-400 mb-1 flex items-center justify-center gap-2">
                                            <Icon name={phase === PHASES.NIGHT ? "Moon" : "Sun"} size={14} />
                                            {phase === PHASES.DAY ? `День ${dayCount}` : phase === PHASES.NIGHT ? `Ночь ${dayCount}` : phase === PHASES.VOTING ? 'Судебное заседание' : phase === PHASES.GAME_OVER ? 'Конец Игры' : 'Итоги ночи'}
                                        </div>
                                        <div className="text-2xl font-black text-white tracking-wide">
                                            {phase === PHASES.NIGHT ? `Цель: ${nightOrder[nightStep]?.action}` : phase === PHASES.VOTING ? 'Голосование' : phase === PHASES.DAY ? 'Свободное обсуждение' : phase === PHASES.GAME_OVER ? 'Результат' : 'Брифинг'}
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-2 bg-slate-950/60 p-2 rounded-2xl border border-white/5 text-sm font-tech w-full sm:w-auto justify-center">
                                        <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-400 font-bold border border-emerald-500/20">
                                            <Icon name="Shield" size={14}/> {stats.city}
                                        </div>
                                        <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 font-bold border border-rose-500/20">
                                            <Icon name="Flame" size={14}/> {stats.mafia}
                                        </div>
                                    </div>
                                </div>

                                {/* Timer HUD */}
                                {phase === PHASES.DAY && (
                                    <div className="omni-card rounded-3xl p-4 sm:p-5 relative overflow-hidden">
                                        <div className="absolute inset-0 bg-gradient-to-r from-indigo-500/5 to-rose-500/5 opacity-50" />
                                        <div className="flex justify-between items-center relative z-10 mb-4">
                                            <div className="flex gap-2">
                                                {[60, 30, 10].map(s => (
                                                    <button key={s} onClick={() => startTimer(s, speakerId)} className="px-4 py-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-xs font-bold text-white transition border border-white/5 shadow-inner">
                                                        {s}с
                                                    </button>
                                                ))}
                                            </div>

                                            <div className="flex items-center gap-4">
                                                <div className={`font-tech text-5xl sm:text-6xl font-black tracking-tighter ${timeLeft <= 10 && timeLeft > 0 ? 'text-rose-500 animate-heartbeat drop-shadow-[0_0_20px_rgba(225,29,72,0.8)]' : 'text-white drop-shadow-md'}`}>
                                                    {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    <button onClick={() => {haptic('light'); triggerSound('click'); setIsTimerRunning(!isTimerRunning)}} className={`p-2.5 rounded-xl transition backdrop-blur-md ${isTimerRunning ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                                                        <Icon name={isTimerRunning ? "Pause" : "Play"} size={20} />
                                                    </button>
                                                    <button onClick={() => {haptic('light'); triggerSound('click'); setIsTimerRunning(false); setTimeLeft(0); setSpeakerId(null);}} className="p-2.5 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500/30 transition border border-rose-500/20">
                                                        <Icon name="Square" size={20} />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="h-2 w-full bg-slate-950/80 rounded-full overflow-hidden shadow-inner relative z-10 border border-white/5">
                                            <div className={`h-full transition-all duration-1000 linear rounded-full ${timeLeft <= 10 ? 'bg-rose-500 shadow-[0_0_15px_rgba(225,29,72,0.8)]' : 'bg-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.8)]'}`} style={{ width: `${(timeLeft / maxTimeRef.current) * 100}%` }} />
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 3. DAY GRID */}
                        {phase === PHASES.DAY && (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 animate-fade-in flex-1">
                                {players.map(p => (
                                    <div key={p.id} className={`rounded-[2rem] p-3 sm:p-4 transition-all duration-300 relative flex flex-col justify-between ${
                                        !p.isAlive ? 'opacity-30 grayscale bg-slate-950/80 border border-slate-900' :
                                        speakerId === p.id ? 'omni-glass ring-2 ring-indigo-500 shadow-[0_0_30px_rgba(99,102,241,0.3)] transform scale-[1.03] z-10' :
                                        nominations.includes(p.id) ? 'omni-glass ring-2 ring-rose-500 shadow-[0_0_20px_rgba(225,29,72,0.2)]' : 'omni-card hover:bg-white/5'
                                    }`}>
                                        
                                        <div>
                                            <div className="flex justify-between items-start mb-3">
                                                <span className="font-tech text-[10px] font-black text-slate-400 bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-white/5 shadow-inner">
                                                    #{p.id.toString().padStart(2, '0')}
                                                </span>
                                                <div className="flex items-center gap-1">
                                                    {p.isAlive && (
                                                        <button onClick={() => toggleSpeaker(p.id)} className={`p-2 rounded-xl transition ${speakerId === p.id ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/40' : 'text-slate-500 hover:bg-white/10 hover:text-white'}`}>
                                                            <Icon name="Mic" size={16} />
                                                        </button>
                                                    )}
                                                    <button onClick={() => cyclePlayerStatus(p.id)} className="p-2 rounded-xl text-slate-500 hover:bg-white/10 hover:text-rose-400 transition">
                                                        <Icon name="Skull" size={16} />
                                                    </button>
                                                    <button onClick={() => {haptic('light'); setPlayers(players.map(pl => pl.id === p.id ? {...pl, isExposed: !pl.isExposed} : pl))}} className="p-2 rounded-xl text-slate-500 hover:bg-white/10 hover:text-white transition">
                                                        <Icon name={p.isExposed ? "EyeOff" : "Eye"} size={16} />
                                                    </button>
                                                </div>
                                            </div>

                                            <input 
                                                value={p.name} 
                                                onChange={(e) => handleNameChange(p.id, e.target.value)}
                                                onFocus={(e) => e.target.select()}
                                                disabled={!p.isAlive}
                                                className="w-full bg-transparent font-black text-lg text-center text-white outline-none py-1 border-b-2 border-transparent focus:border-indigo-500/50 mb-3 truncate transition-colors drop-shadow-md"
                                            />

                                            <div className="h-8 flex items-center justify-center gap-2 mb-3">
                                                {p.isExposed && (
                                                    <span className={`text-[9px] font-black uppercase tracking-widest px-2.5 py-1.5 rounded-lg border backdrop-blur-md shadow-lg ${ROLES[p.role].bg} ${ROLES[p.role].color} ${ROLES[p.role].border}`}>
                                                        {ROLES[p.role].name}
                                                    </span>
                                                )}
                                                {p.isAlive && !p.isExposed && (p.knownToSheriff || p.knownToDon) && (
                                                    <div className="flex gap-1.5">
                                                        {p.knownToSheriff && <div className="w-6 h-6 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center"><Icon name="Shield" size={12} className="text-amber-400" /></div>}
                                                        {p.knownToDon && <div className="w-6 h-6 rounded-lg bg-red-600/20 border border-red-600/40 flex items-center justify-center font-tech text-[10px] font-black text-red-400">D</div>}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {p.isAlive && (
                                            <button onClick={() => toggleNomination(p.id)} className={`w-full py-3.5 rounded-xl text-[11px] font-black uppercase tracking-[0.2em] transition-all duration-300 ${
                                                nominations.includes(p.id) ? 'bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.5)] border border-rose-400' : 'bg-slate-900/50 text-slate-400 hover:bg-white/10 hover:text-white border border-white/5'
                                            }`}>
                                                {nominations.includes(p.id) ? 'Снять' : 'Выставить'}
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 4. VOTING PHASE */}
                        {phase === PHASES.VOTING && (
                            <div className="max-w-2xl mx-auto w-full space-y-4 animate-slide-up pt-4 flex-1">
                                <div className="text-center text-[10px] text-slate-400 font-black uppercase tracking-widest mb-6">Распределение голосов стола</div>
                                {nominations.map(id => {
                                    const p = players.find(x => x.id === id);
                                    return (
                                        <div key={id} className="p-4 sm:p-6 rounded-[2rem] omni-glass flex flex-col sm:flex-row items-center justify-between gap-4 border-l-4 border-l-rose-500 transition-transform hover:scale-[1.01]">
                                            <div className="flex items-center gap-4 w-full sm:w-auto">
                                                <div className="w-14 h-14 bg-slate-900/80 rounded-2xl flex items-center justify-center font-tech font-black text-slate-400 border border-white/5 shadow-inner text-lg">#{p?.id}</div>
                                                <span className="text-white font-black text-2xl truncate">{p?.name}</span>
                                            </div>
                                            <div className="flex items-center justify-between w-full sm:w-auto gap-4 omni-card rounded-3xl p-1.5">
                                                <button onClick={() => addVote(id, -1)} className="w-14 h-14 rounded-[1.25rem] bg-slate-800/80 text-slate-400 hover:bg-slate-700 hover:text-white transition font-black text-2xl flex items-center justify-center">-</button>
                                                <span className="font-tech text-4xl font-black text-rose-500 w-12 text-center drop-shadow-[0_0_15px_rgba(225,29,72,0.6)]">{votes[id]}</span>
                                                <button onClick={() => addVote(id, 1)} className="w-14 h-14 rounded-[1.25rem] bg-slate-800/80 text-slate-400 hover:bg-slate-700 hover:text-white transition font-black text-2xl flex items-center justify-center">+</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                        {/* 5. NIGHT PHASE */}
                        {phase === PHASES.NIGHT && nightOrder.length > 0 && (
                            <div className="max-w-4xl mx-auto w-full animate-fade-in pt-8 flex-1">
                                <div className="text-center mb-12 space-y-4">
                                    <div className="inline-flex p-5 rounded-[2rem] bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 shadow-[0_0_50px_rgba(99,102,241,0.2)] animate-float">
                                        <Icon name="Moon" size={48} />
                                    </div>
                                    <h2 className="text-4xl sm:text-5xl font-black text-white tracking-tight drop-shadow-lg">{nightOrder[nightStep].action}</h2>
                                    <p className="text-indigo-300 font-bold tracking-widest uppercase text-xs">{nightOrder[nightStep].desc}</p>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                    {players.filter(p => p.isAlive).map(p => (
                                        <button key={p.id} onClick={() => handleNightAction(p.id)} className="p-5 sm:p-6 rounded-[2rem] omni-glass hover:bg-indigo-600/20 border-white/5 hover:border-indigo-400/50 text-left transition-all duration-300 transform hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(99,102,241,0.3)] group relative overflow-hidden">
                                            <div className="absolute inset-0 bg-gradient-to-br from-indigo-500/0 to-indigo-500/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
                                            <div className="flex justify-between items-start mb-4 relative z-10">
                                                <div className="font-tech text-xs font-black text-slate-400 bg-slate-900 px-3 py-1.5 rounded-xl border border-white/5 shadow-inner">#{p.id.toString().padStart(2, '0')}</div>
                                                <div className={`text-[9px] font-black uppercase tracking-widest px-2.5 py-1.5 rounded-lg border shadow-lg ${ROLES[p.role].bg} ${ROLES[p.role].color} ${ROLES[p.role].border}`}>
                                                    {ROLES[p.role].name}
                                                </div>
                                            </div>
                                            <div className="font-black text-xl text-white truncate relative z-10 group-hover:text-indigo-200 transition-colors">{p.name}</div>
                                            <Icon name="Crosshair" size={80} className="absolute -bottom-4 -right-4 opacity-5 group-hover:opacity-20 text-indigo-400 transition-all transform group-hover:scale-110 duration-500" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* EMPTY NIGHT */}
                        {phase === PHASES.NIGHT && nightOrder.length === 0 && (
                            <div className="flex flex-col items-center justify-center flex-1 animate-slide-up">
                                <div className="relative mb-8">
                                    <div className="absolute inset-0 bg-indigo-500/20 rounded-full blur-[50px] animate-pulse-glow" />
                                    <Icon name="AlertCircle" size={100} className="text-indigo-400 relative z-10" />
                                </div>
                                <h2 className="text-3xl font-black text-white tracking-wide mb-12">Нет активных ролей</h2>
                            </div>
                        )}

                        {/* */}
                        {/* 6. BRIEFING PHASE */}
                        {phase === PHASES.BRIEFING && (
                            <div className="max-w-2xl mx-auto w-full animate-slide-up pt-8 flex-1">
                                <div className="omni-glass rounded-[3rem] p-8 sm:p-10 relative overflow-hidden">
                                    <div className="absolute -top-16 -right-16 opacity-5 transform rotate-12 pointer-events-none">
                                        <Icon name="Sun" size={300} />
                                    </div>
                                    
                                    <div className="relative z-10">
                                        <div className="inline-flex items-center gap-3 bg-amber-500/10 border border-amber-500/30 px-5 py-2.5 rounded-full mb-8 shadow-[0_0_30px_rgba(245,158,11,0.15)]">
                                            <Icon name="Sun" size={20} className="text-amber-500" />
                                            <span className="text-[10px] font-black text-amber-400 uppercase tracking-widest">Утренний отчет</span>
                                        </div>
                                        
                                        <div className="text-white text-2xl sm:text-3xl font-black leading-tight mb-10 border-l-4 border-amber-500 pl-6 bg-gradient-to-r from-slate-900/60 to-transparent py-6 rounded-r-3xl">
                                            Город просыпается.<br/>
                                            <span className={`block mt-3 ${briefingData?.killedNames?.length > 0 ? 'text-rose-400 drop-shadow-[0_0_15px_rgba(225,29,72,0.5)]' : 'text-emerald-400 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]'}`}>
                                                {briefingData?.killedNames?.length > 0 ? `Этой ночью нас покинул(и): ${briefingData.killedNames.join(', ')}.` : 'Этой ночью никто не умер.'}
                                            </span>
                                        </div>

                                        {briefingData?.reports?.length > 0 && (
                                            <div className="pt-8 border-t border-white/10 space-y-4">
                                                <div className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-500/10 border border-indigo-500/20 rounded-full">
                                                    <Icon name="Shield" size={14} className="text-indigo-400"/>
                                                    <span className="text-[9px] font-black text-indigo-400 uppercase tracking-widest">Секретно / Для ведущего</span>
                                                </div>
                                                <div className="grid gap-3">
                                                    {briefingData.reports.map((report, idx) => {
                                                        const isMafia = report.includes('ЧЕРНЫЙ') || report.includes('ШЕРИФ НАЙДЕН');
                                                        return (
                                                            <div key={idx} className={`p-5 rounded-2xl border backdrop-blur-md font-bold text-sm sm:text-base flex items-center gap-4 shadow-lg ${isMafia ? 'bg-rose-900/30 border-rose-500/40 text-rose-200' : 'bg-indigo-900/30 border-indigo-500/40 text-indigo-200'}`}>
                                                                <div className={`p-2.5 rounded-xl ${isMafia ? 'bg-rose-500/20 text-rose-400' : 'bg-indigo-500/20 text-indigo-400'}`}>
                                                                    <Icon name="Eye" size={20} />
                                                                </div>
                                                                {report}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                        {/* 7. GAME OVER */}
                        {phase === PHASES.GAME_OVER && (
                            <div className="max-w-3xl mx-auto w-full flex flex-col items-center justify-center animate-fade-in pt-12 flex-1 text-center">
                                <div className="relative mb-12 animate-float">
                                    <div className={`absolute inset-0 rounded-full blur-[80px] animate-pulse-glow ${winner === 'Победа Мафии' ? 'bg-rose-500/40' : 'bg-emerald-500/40'}`} />
                                    <div className={`p-10 rounded-[3rem] omni-card border shadow-2xl relative z-10 ${winner === 'Победа Мафии' ? 'border-rose-500/50' : 'border-emerald-500/50'}`}>
                                        <Icon name="Trophy" size={120} className={winner === 'Победа Мафии' ? 'text-rose-500 drop-shadow-[0_0_30px_rgba(225,29,72,0.8)]' : 'text-emerald-500 drop-shadow-[0_0_30px_rgba(16,185,129,0.8)]'} />
                                    </div>
                                </div>
                                
                                <h1 className={`text-5xl sm:text-7xl font-black mb-12 uppercase tracking-tighter drop-shadow-[0_0_40px_rgba(0,0,0,0.8)] ${
                                    winner === 'Победа Мафии' ? 'text-transparent bg-clip-text bg-gradient-to-b from-rose-400 to-rose-600' : 
                                    winner === 'Победа Мирных' ? 'text-transparent bg-clip-text bg-gradient-to-b from-emerald-400 to-emerald-600' : 'text-white'
                                }`}>
                                    {winner}
                                </h1>

                                <div className="w-full omni-glass rounded-[3rem] p-8 shadow-2xl">
                                    <h3 className="text-left text-[10px] font-black text-slate-500 uppercase tracking-widest mb-6">Сводка по игрокам</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                        {players.map(p => (
                                            <div key={p.id} className="bg-slate-900/60 p-4 rounded-2xl flex items-center justify-between border border-white/5 shadow-inner">
                                                <div className="flex items-center gap-3">
                                                    <span className="font-tech text-xs text-slate-500">#{p.id}</span>
                                                    <span className={`font-black text-sm ${p.isAlive ? 'text-white' : 'text-slate-600 line-through'}`}>{p.name}</span>
                                                </div>
                                                <span className={`text-[9px] font-black uppercase px-2.5 py-1 rounded-lg border shadow-lg ${ROLES[p.role].bg} ${ROLES[p.role].color} ${ROLES[p.role].border} ${ROLES[p.role].glow}`}>
                                                    {ROLES[p.role].name}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                    </div>

                    {/* ULTRA-DOCK (FLOATING BOTTOM BAR) */}
                    {phase !== PHASES.SETUP && (
                        <div className="fixed bottom-0 inset-x-0 pb-6 pt-8 px-4 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent z-[100] pointer-events-none flex justify-center">
                            <div className="pointer-events-auto max-w-2xl w-full">
                                
                                {phase === PHASES.DAY && (
                                    <button onClick={endDay} className={`w-full py-5 sm:py-6 rounded-3xl font-black text-lg sm:text-xl tracking-widest uppercase transition-all duration-300 transform active:scale-95 shadow-2xl border relative overflow-hidden group flex items-center justify-center gap-3 ${
                                        nominations.length > 0 ? 'bg-gradient-to-r from-rose-600 to-rose-500 text-white shadow-[0_10px_40px_rgba(225,29,72,0.4)] border-rose-400' : 'bg-white text-slate-950 shadow-[0_10px_40px_rgba(255,255,255,0.2)] border-white'
                                    }`}>
                                        <div className="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity" />
                                        <Icon name={nominations.length > 0 ? "Crosshair" : "Moon"} size={24} className="relative z-10" />
                                        <span className="relative z-10 drop-shadow-sm">{nominations.length > 0 ? 'Голосование' : 'В Ночь'}</span>
                                    </button>
                                )}

                                {phase === PHASES.VOTING && (
                                    <button onClick={calculateVoting} className="w-full py-5 sm:py-6 rounded-3xl bg-gradient-to-r from-rose-600 to-rose-500 text-white font-black text-lg sm:text-xl tracking-widest uppercase transition-all duration-300 transform active:scale-95 shadow-[0_10px_40px_rgba(225,29,72,0.5)] border border-rose-400 relative overflow-hidden group flex items-center justify-center gap-3">
                                        <div className="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity" />
                                        <Icon name="Check" size={24} className="relative z-10" />
                                        <span className="relative z-10 drop-shadow-sm">Фиксировать итог</span>
                                    </button>
                                )}

                                {phase === PHASES.NIGHT && (
                                    <button onClick={() => handleNightAction(null)} className="w-full py-5 sm:py-6 rounded-3xl omni-glass hover:bg-slate-800 text-white font-black text-lg sm:text-xl tracking-widest uppercase transition-all duration-300 transform active:scale-95 shadow-2xl border-white/20">
                                        Пропустить
                                    </button>
                                )}

                                {phase === PHASES.BRIEFING && (
                                    <button onClick={() => {
                                        saveToHistory();
                                        haptic('success');
                                        triggerSound('select');
                                        if (briefingData?.gameOver) { setWinner(briefingData.gameOver); setPhase(PHASES.GAME_OVER); } 
                                        else { setDayCount(d => d + 1); setPhase(PHASES.DAY); }
                                    }} className="w-full py-5 sm:py-6 rounded-3xl bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 font-black text-lg sm:text-xl tracking-widest uppercase transition-all duration-300 transform active:scale-95 shadow-[0_10px_40px_rgba(16,185,129,0.4)] border border-emerald-300 relative overflow-hidden group flex items-center justify-center gap-3">
                                        <div className="absolute inset-0 bg-white opacity-0 group-hover:opacity-30 transition-opacity" />
                                        <Icon name={briefingData?.gameOver ? "Trophy" : "Sun"} size={24} className="relative z-10" />
                                        <span className="relative z-10 drop-shadow-sm">{briefingData?.gameOver ? 'Показать Итоги' : `Начать День ${dayCount + 1}`}</span>
                                    </button>
                                )}

                                {phase === PHASES.GAME_OVER && (
                                    <button onClick={() => {haptic('light'); triggerSound('select'); setPhase(PHASES.SETUP);}} className="w-full py-5 sm:py-6 rounded-3xl bg-white text-slate-950 font-black text-lg sm:text-xl tracking-widest uppercase transition-all duration-300 transform active:scale-95 shadow-[0_10px_40px_rgba(255,255,255,0.2)] border border-white relative overflow-hidden group flex items-center justify-center gap-3">
                                        <div className="absolute inset-0 bg-indigo-100 opacity-0 group-hover:opacity-100 transition-opacity" />
                                        <Icon name="RotateCcw" size={24} className="relative z-10 text-indigo-600" />
                                        <span className="relative z-10 drop-shadow-sm">Новая Игра</span>
                                    </button>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MafiaOS />);
    </script>
</body>
</html>
