                                        {/* Кнопка ВКЛ/ВЫКЛ Фоновой музыки */}
                                        <button 
                                            onClick={() => { haptic('light'); setBgMusicEnabled(!bgMusicEnabled); }} 
                                            className={`px-3.5 py-2.5 rounded-2xl text-xs font-black uppercase tracking-wider flex items-center gap-2 transition border ${bgMusicEnabled ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'bg-slate-900/60 text-slate-500 border-white/5'}`}
                                        >
                                            <Icon name={bgMusicEnabled ? "Volume2" : "VolumeX"} size={16} />
                                            <span>Фон</span>
                                        </button>

                                        {/* Кнопка ВКЛ/ВЫКЛ Музыки ролей */}
                                        <button 
                                            onClick={() => { haptic('light'); setRoleMusicEnabled(!roleMusicEnabled); }} 
                                            className={`px-3.5 py-2.5 rounded-2xl text-xs font-black uppercase tracking-wider flex items-center gap-2 transition border ${roleMusicEnabled ? 'bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-500/40 shadow-[0_0_15px_rgba(217,70,239,0.2)]' : 'bg-slate-900/60 text-slate-500 border-white/5'}`}
                                        >
                                            <Icon name="Music" size={16} />
                                            <span>Роли</span>
                                        </button>

                                        {/* Кнопка открытия Аудио-Студии */}
                                        <button onClick={() => setShowAudioStudio(true)} title="Открыть Аудиотеку" className="p-3 rounded-2xl bg-white/5 hover:bg-white/15 text-slate-300 hover:text-white border border-white/10 transition">
                                            <Icon name="Headphones" size={18} />
                                        </button>

                                        {/* Кнопка логов */}
                                        <button onClick={() => setShowLog(true)} title="Журнал игры" className="p-3 rounded-2xl bg-white/5 hover:bg-white/15 text-slate-300 hover:text-white border border-white/10 transition">
                                            <Icon name="Terminal" size={18} />
                                        </button>
                                    </div>

                                    {/* Центральный индикатор фазы */}
                                    <div className="text-center flex-1">
                                        <div className="text-[10px] font-black tracking-[0.25em] uppercase text-indigo-400 mb-1 flex items-center justify-center gap-2">
                                            <Icon name={phase === PHASES.NIGHT ? "Moon" : "Sun"} size={14} />
                                            {phase === PHASES.DAY ? `День ${dayCount}` : phase === PHASES.NIGHT ? `Ночь ${dayCount}` : phase === PHASES.VOTING ? 'Суд города' : phase === PHASES.GAME_OVER ? 'Финал игры' : 'Утренняя сводка'}
                                        </div>
                                        <div className="text-xl sm:text-2xl font-black text-white tracking-wide">
                                            {phase === PHASES.NIGHT ? nightOrder[nightStep]?.action : phase === PHASES.VOTING ? 'Голосование' : phase === PHASES.DAY ? 'Обсуждение за столом' : phase === PHASES.GAME_OVER ? 'Итоги партии' : 'Брифинг'}
                                        </div>
                                    </div>

                                    {/* Правый блок: Счетчик живых Сил Города и Мафии */}
                                    <div className="flex items-center gap-2.5 bg-slate-950 p-2 rounded-2xl border border-white/10 text-sm font-tech w-full lg:w-auto justify-center">
                                        <div className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-emerald-500/15 text-emerald-400 font-black border border-emerald-500/30">
                                            <Icon name="Shield" size={15}/> Мирные: {stats.city}
                                        </div>
                                        <div className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-rose-500/15 text-rose-400 font-black border border-rose-500/30">
                                            <Icon name="Flame" size={15}/> Мафия: {stats.mafia}
                                        </div>
                                    </div>
                                </div>

                                {/* Таймер речи для Дневной фазы */}
                                {phase === PHASES.DAY && (
                                    <div className="omni-card rounded-3xl p-4 sm:p-5 relative overflow-hidden">
                                        <div className="flex flex-wrap justify-between items-center relative z-10 gap-4 mb-3">
                                            <div className="flex items-center gap-2">
                                                {[60, 30, 15].map(s => (
                                                    <button key={s} onClick={() => startTimer(s, speakerId)} className="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs font-black text-slate-200 transition border border-white/10">
                                                        {s} сек
                                                    </button>
                                                ))}
                                                <button onClick={nextAliveSpeaker} className="px-4 py-2 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-xs font-black text-indigo-300 transition border border-indigo-500/30 flex items-center gap-1.5">
                                                    <Icon name="SkipForward" size={14} /> След. спикер
                                                </button>
                                            </div>

                                            <div className="flex items-center gap-4 ml-auto">
                                                {speakerId && (
                                                    <span className="text-xs font-bold text-indigo-300 bg-indigo-950/80 px-3 py-1.5 rounded-xl border border-indigo-500/30">
                                                        Говорит: #{speakerId} {players.find(p => p.id === speakerId)?.name}
                                                    </span>
                                                )}
                                                <div className={`font-tech text-4xl sm:text-5xl font-black tracking-tighter ${timeLeft <= 10 && timeLeft > 0 ? 'text-rose-500 animate-heartbeat' : 'text-white'}`}>
                                                    {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                                                </div>
                                                <div className="flex gap-1.5">
                                                    <button onClick={() => {haptic('light'); triggerSound('click'); setIsTimerRunning(!isTimerRunning)}} className={`p-3 rounded-xl transition ${isTimerRunning ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'}`}>
                                                        <Icon name={isTimerRunning ? "Pause" : "Play"} size={18} />
                                                    </button>
                                                    <button onClick={() => {haptic('light'); triggerSound('click'); setIsTimerRunning(false); setTimeLeft(0); setSpeakerId(null);}} className="p-3 rounded-xl bg-rose-500/15 text-rose-400 hover:bg-rose-500/30 transition border border-rose-500/30">
                                                        <Icon name="Square" size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="h-2 w-full bg-slate-950 rounded-full overflow-hidden border border-white/5">
                                            <div className={`h-full transition-all duration-1000 ease-linear rounded-full ${timeLeft <= 10 ? 'bg-rose-500' : 'bg-indigo-500'}`} style={{ width: `${(timeLeft / maxTimeRef.current) * 100}%` }} />
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ================= 3. ДНЕВНАЯ СЕТКА ИГРОКОВ (3D КАРТОЧКИ + ФОЛЫ) ================= */}
                        {phase === PHASES.DAY && (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5 sm:gap-4 animate-fade-in flex-1">
                                {players.map(p => (
                                    <div key={p.id} className="player-card-container h-[240px]">
                                        <div className={`player-card-flipper ${p.isExposed ? 'flipped' : ''}`}>
                                            
                                            {/* ЛИЦЕВАЯ СТОРОНА (РОЛЬ СКРЫТА) */}
                                            <div className={`card-front flex flex-col justify-between p-4 transition-all duration-300 ${
                                                !p.isAlive ? 'opacity-35 grayscale bg-slate-950/90 border border-slate-800' :
                                                speakerId === p.id ? 'omni-glass ring-2 ring-indigo-500 shadow-[0_0_35px_rgba(99,102,241,0.35)]' :
                                                nominations.includes(p.id) ? 'omni-glass ring-2 ring-rose-500 shadow-[0_0_25px_rgba(225,29,72,0.3)]' : 'omni-card omni-card-hover'
                                            }`}>
                                                <div>
                                                    <div className="flex justify-between items-center mb-3">
                                                        <span className="font-tech text-xs font-black text-slate-300 bg-slate-950 px-2.5 py-1 rounded-lg border border-white/10">
                                                            #{p.id.toString().padStart(2, '0')}
                                                        </span>
                                                        <div className="flex items-center gap-1">
                                                            {p.isAlive && (
                                                                <button onClick={() => toggleSpeaker(p.id)} title="Дать слово (60с)" className={`p-2 rounded-xl transition ${speakerId === p.id ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:bg-white/10 hover:text-white'}`}>
                                                                    <Icon name="Mic" size={16} />
                                                                </button>
                                                            )}
                                                            <button onClick={() => cyclePlayerStatus(p.id)} title="Убить / Оживить" className="p-2 rounded-xl text-slate-400 hover:bg-white/10 hover:text-rose-400 transition">
                                                                <Icon name="Skull" size={16} />
                                                            </button>
                                                            <button onClick={() => {haptic('medium'); triggerSound('flip'); setPlayers(players.map(pl => pl.id === p.id ? {...pl, isExposed: true} : pl))}} title="Посмотреть роль" className="p-2 rounded-xl text-slate-400 hover:bg-white/10 hover:text-indigo-300 transition">
                                                                <Icon name="Eye" size={16} />
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <input 
                                                        value={p.name} 
                                                        onChange={(e) => handleNameChange(p.id, e.target.value)}
                                                        disabled={!p.isAlive}
                                                        className="w-full bg-transparent font-black text-lg text-center text-white outline-none py-1 border-b border-transparent focus:border-indigo-500/50 mb-2 truncate"
                                                    />

                                                    {/* Счетчик фолов и метки проверок */}
                                                    <div className="flex items-center justify-between px-1 my-2">
                                                        {p.isAlive ? (
                                                            <button onClick={() => addFoul(p.id)} className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-950/80 border border-white/5 hover:border-amber-500/40 transition" title="Добавить фол">
                                                                <span className="text-[10px] font-black uppercase text-slate-400">Фол:</span>
                                                                <div className="flex gap-1">
                                                                    {[1, 2, 3, 4].map(f => (
                                                                        <span key={f} className={`w-2 h-2 rounded-full ${p.fouls >= f ? (p.fouls === 4 ? 'bg-rose-500 animate-ping' : 'bg-amber-400') : 'bg-slate-800'}`} />
                                                                    ))}
                                                                </div>
                                                            </button>
                                                        ) : <span className="text-[10px] font-black uppercase text-rose-500">Вне игры</span>}

                                                        <div className="flex gap-1">
                                                            {p.knownToSheriff && <span title="Проверен Шерифом" className="w-6 h-6 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400"><Icon name="Shield" size={12} /></span>}
                                                            {p.knownToDon && <span title="Проверен Доном" className="w-6 h-6 rounded-lg bg-red-600/20 border border-red-600/40 flex items-center justify-center font-tech text-[10px] font-black text-red-400">D</span>}
                                                        </div>
                                                    </div>
                                                </div>

                                                {p.isAlive && (
                                                    <button onClick={() => toggleNomination(p.id)} className={`w-full py-3.5 rounded-2xl text-[11px] font-black uppercase tracking-[0.18em] transition-all ${
                                                        nominations.includes(p.id) ? 'bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.5)] border border-rose-400' : 'bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-white/5'
                                                    }`}>
                                                        {nominations.includes(p.id) ? 'В суде (Снять)' : 'Выставить'}
                                                    </button>
                                                )}
                                            </div>

                                            {/* ОБРАТНАЯ СТОРОНА (РОЛЬ РАСКРЫТА) */}
                                            <div className={`card-back flex flex-col justify-between p-4 border-2 ${ROLES[p.role].bg} ${ROLES[p.role].border} backdrop-blur-xl`}>
                                                <div className="flex justify-between items-center">
                                                    <span className="font-tech text-xs text-white/70 bg-black/40 px-2.5 py-1 rounded-lg border border-white/10">#{p.id.toString().padStart(2, '0')}</span>
                                                    <button onClick={() => {haptic('light'); triggerSound('flip'); setPlayers(players.map(pl => pl.id === p.id ? {...pl, isExposed: false} : pl))}} className="p-2 rounded-xl text-white/70 hover:text-white bg-black/30">
                                                        <Icon name="EyeOff" size={16} />
                                                    </button>
                                                </div>
                                                <div className="text-center space-y-2 my-auto">
                                                    <div className="font-black text-xl text-white truncate px-2">{p.name}</div>
                                                    <div className={`inline-block text-base font-black uppercase tracking-widest px-4 py-1.5 rounded-xl border bg-black/50 ${ROLES[p.role].color} ${ROLES[p.role].border}`}>
                                                        {ROLES[p.role].name}
                                                    </div>
                                                </div>
                                                <div className="text-center">
                                                    {!p.isAlive ? (
                                                        <span className="text-rose-400 font-black text-xs uppercase tracking-widest"><Icon name="Skull" size={14} className="inline mr-1"/> Покинул игру</span>
                                                    ) : (
                                                        <span className="text-emerald-300 font-bold text-xs uppercase tracking-widest">Активен за столом</span>
                                                    )}
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* ================= 4. ФАЗА ГОЛОСОВАНИЯ ================= */}
                        {phase === PHASES.VOTING && (
                            <div className="max-w-3xl mx-auto w-full space-y-4 animate-slide-up pt-2 flex-1">
                                <div className="text-center text-xs text-indigo-300 font-black uppercase tracking-[0.2em] mb-6 bg-indigo-950/40 py-3 rounded-2xl border border-indigo-500/20">
                                    Голосование за изгнание • Живых игроков: {stats.alive}
                                </div>
                                {nominations.map(id => {
                                    const p = players.find(x => x.id === id);
                                    const votePercentage = stats.alive > 0 ? (votes[id] / stats.alive) * 100 : 0;
                                    return (
                                        <div key={id} className="p-5 rounded-[2rem] omni-glass relative overflow-hidden border border-white/10">
                                            <div className="absolute top-0 left-0 bottom-0 bg-gradient-to-r from-rose-600/25 to-transparent vote-bar-fill border-r border-rose-500/50" style={{ width: `${votePercentage}%` }} />
                                            <div className="relative z-10 flex flex-col sm:flex-row items-center justify-between gap-4">
                                                <div className="flex items-center gap-4 w-full sm:w-auto">
                                                    <div className="w-14 h-14 bg-slate-950 rounded-2xl flex items-center justify-center font-tech font-black text-slate-300 border border-white/10 text-lg">#{p?.id}</div>
                                                    <div>
                                                        <span className="text-white font-black text-2xl block">{p?.name}</span>
                                                        <span className="text-[10px] font-black text-rose-300 uppercase tracking-widest">{votePercentage.toFixed(0)}% голосов стола</span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center justify-between w-full sm:w-auto gap-4 bg-slate-950/80 rounded-2xl p-1.5 border border-white/10">
                                                    <button onClick={() => addVote(id, -1)} className="w-14 h-14 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white transition font-black text-2xl flex items-center justify-center">-</button>
                                                    <span className="font-tech text-4xl font-black text-rose-500 w-14 text-center">{votes[id]}</span>
                                                    <button onClick={() => addVote(id, 1)} className="w-14 h-14 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white transition font-black text-2xl flex items-center justify-center">+</button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* ================= 5. НОЧНАЯ ФАЗА (ТАЙМЛАЙН, МУЗЫКА РОЛИ И ОТКЛИК КНОПОК) ================= */}
                        {phase === PHASES.NIGHT && nightOrder.length > 0 && (
                            <div className="max-w-5xl mx-auto w-full animate-fade-in pt-2 flex-1">
                                
                                {/* Таймлайн шагов ночи + Индикатор играющего трека роли */}
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 mb-8 bg-slate-950/70 p-3.5 rounded-3xl border border-white/10">
                                    <div className="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                                        {nightOrder.map((step, idx) => (
                                            <div key={step.role} className={`px-3.5 py-1.5 rounded-xl text-[11px] font-black uppercase tracking-wider whitespace-nowrap transition-all ${
                                                idx === nightStep ? 'bg-indigo-600 text-white shadow-[0_0_20px_rgba(99,102,241,0.5)]' :
                                                idx < nightStep ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-white/5 text-slate-500'
                                            }`}>
                                                {idx + 1}. {step.role === 'MAFIA_GROUP' ? 'Мафия' : ROLES[step.role]?.name}
                                            </div>
                                        ))}
                                    </div>

                                    {/* Индикатор эквалайзера ролевой музыки */}
                                    <div className="flex items-center gap-3 px-4 py-1.5 rounded-2xl bg-fuchsia-950/40 border border-fuchsia-500/30">
                                        {roleMusicEnabled ? (
                                            <div className="flex items-end gap-0.5 h-3.5 w-4">
                                                <span className="w-1 bg-fuchsia-400 animate-eq-1 rounded-full"/>
                                                <span className="w-1 bg-fuchsia-400 animate-eq-2 rounded-full"/>
                                                <span className="w-1 bg-fuchsia-400 animate-eq-3 rounded-full"/>
                                            </div>
                                        ) : <Icon name="VolumeX" size={14} className="text-slate-500" />}
                                        <span className="text-[11px] font-bold text-fuchsia-200 truncate max-w-[200px]">
                                            {roleMusicEnabled ? (tracks[nightOrder[nightStep].role]?.title || 'Музыка роли активна') : 'Музыка ролей выкл.'}
                                        </span>
                                    </div>
                                </div>

                                <div className="text-center mb-10 space-y-3">
                                    <h2 className="text-4xl sm:text-6xl font-black text-white tracking-tight">{nightOrder[nightStep].action}</h2>
                                    <p className="text-indigo-300 font-bold tracking-[0.18em] uppercase text-xs">{nightOrder[nightStep].desc}</p>
                                    
                                    {/* Предупреждение ведущему, если роль уже заблокирована Красоткой */}
                                    {isCurrentNightRoleBlocked && (
                                        <div className="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs font-black uppercase tracking-wider animate-pulse">
                                            <Icon name="Lock" size={15} /> Внимание ведущему: эта роль заблокирована Красоткой!
                                        </div>
                                    )}
                                </div>

                                {/* Сетка выбора игроков ночью (с авто-сбросом кнопки и пальцем Вверх/Вниз/Блок) */}
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                                    {players.filter(p => p.isAlive).map(p => {
                                        const isAnimating = nightAnim && nightAnim.targetId === p.id;
                                        let cardStyle = 'omni-glass border-white/10 omni-card-hover';
                                        let statusBadge = null;

                                        if (isAnimating) {
                                            if (nightAnim.status === 'YES') {
                                                cardStyle = 'bg-emerald-600/90 border-emerald-300 shadow-[0_0_50px_rgba(16,185,129,0.9)] scale-[1.04] z-20';
                                                statusBadge = (
                                                    <div className="mt-3 flex items-center justify-center gap-2 py-2 rounded-xl bg-black/40 text-white font-black text-sm uppercase tracking-widest">
                                                        <Icon name="ThumbsUp" size={20} /> ДА (ПОДТВЕРЖДЕНО)
                                                    </div>
                                                );
                                            } else if (nightAnim.status === 'NO') {
                                                cardStyle = 'bg-rose-600/90 border-rose-300 shadow-[0_0_50px_rgba(225,29,72,0.9)] scale-[1.04] z-20';
                                                statusBadge = (
                                                    <div className="mt-3 flex items-center justify-center gap-2 py-2 rounded-xl bg-black/40 text-white font-black text-sm uppercase tracking-widest">
                                                        <Icon name="ThumbsDown" size={20} /> НЕТ (МИМО)
                                                    </div>
                                                );
                                            } else if (nightAnim.status === 'BLOCKED') {
                                                cardStyle = 'bg-amber-500/90 border-amber-200 shadow-[0_0_50px_rgba(245,158,11,0.9)] scale-[1.04] z-20';
                                                statusBadge = (
                                                    <div className="mt-3 flex items-center justify-center gap-2 py-2 rounded-xl bg-black/50 text-white font-black text-xs uppercase tracking-widest">
                                                        <Icon name="Lock" size={18} /> ВЫ В БЛОКЕ КРАСОТКИ
                                                    </div>
                                                );
                                            } else if (nightAnim.status === 'SELECTED') {
                                                cardStyle = 'bg-indigo-600/90 border-indigo-300 shadow-[0_0_40px_rgba(99,102,241,0.85)] scale-[1.03] z-20';
                                                statusBadge = (
                                                    <div className="mt-3 flex items-center justify-center gap-2 py-1.5 rounded-xl bg-black/30 text-white font-black text-xs uppercase tracking-widest">
                                                        <Icon name="Check" size={16} /> ВЫБРАНО
                                                    </div>
                                                );
                                            }
                                        }

                                        return (
                                            <button 
                                                key={`${nightStep}-${p.id}`} 
                                                onClick={() => handleNightAction(p.id)} 
                                                disabled={!!nightAnim} 
                                                className={`p-5 rounded-[2rem] border text-left transition-all duration-300 relative overflow-hidden ${cardStyle}`}
                                            >
                                                <div className="flex justify-between items-center mb-3 relative z-10">
                                                    <span className="font-tech text-xs font-black text-slate-200 bg-slate-950/90 px-3 py-1 rounded-xl border border-white/10">
                                                        #{p.id.toString().padStart(2, '0')}
                                                    </span>
                                                    {/* Если проверяющий в блоке, скрываем роль на карточке в момент клика, чтобы не сбивать ведущего */}
                                                    <span className={`text-[9px] font-black uppercase tracking-widest px-2.5 py-1 rounded-lg border ${
                                                        isAnimating ? 'bg-black/40 text-white border-white/20' : `${ROLES[p.role].bg} ${ROLES[p.role].color}${ROLES[p.role].border}`
                                                    }`}>
                                                        {isAnimating && nightAnim.status === 'BLOCKED' ? 'СКРЫТО БЛОКОМ' : ROLES[p.role].name}
                                                    </span>
                                                </div>
                                                <div className="font-black text-xl text-white truncate relative z-10">{p.name}</div>
                                                {statusBadge}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* ЕСЛИ НОЧЬЮ НЕТ АКТИВНЫХ РОЛЕЙ */}
                        {phase === PHASES.NIGHT && nightOrder.length === 0 && (
                            <div className="flex flex-col items-center justify-center flex-1 animate-slide-up py-16">
                                <Icon name="AlertCircle" size={96} className="text-indigo-400 mb-6" />
                                <h2 className="text-3xl font-black text-white tracking-wide mb-4">Нет активных ночных ролей</h2>
                                <button onClick={() => finishNight({})} className="px-8 py-4 rounded-2xl bg-indigo-600 text-white font-black uppercase tracking-widest">
                                    Перейти к утру
                                </button>
                            </div>
                        )}

                        {/* ================= 6. УТРЕННИЙ БРИФИНГ ================= */}
                        {phase === PHASES.BRIEFING && (
                            <div className="max-w-3xl mx-auto w-full animate-slide-up pt-4 flex-1">
                                <div className="omni-glass rounded-[2.5rem] p-8 sm:p-10 relative overflow-hidden border border-amber-500/20">
                                    <div className="relative z-10">
                                        <div className="inline-flex items-center gap-2.5 bg-amber-500/15 border border-amber-500/40 px-5 py-2 rounded-full mb-8">
                                            <Icon name="Sun" size={20} className="text-amber-400" />
                                            <span className="text-xs font-black text-amber-300 uppercase tracking-[0.2em]">Утренняя сводка</span>
                                        </div>
                                        
                                        <div className="text-white text-2xl sm:text-4xl font-black leading-tight mb-10 border-l-4 border-amber-500 pl-6 bg-slate-900/60 py-6 rounded-r-3xl">
                                            Город просыпается.<br/>
                                            <span className={`block mt-3 ${briefingData?.killedNames?.length > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                                                {briefingData?.killedNames?.length > 0 ? `Этой ночью убиты: ${briefingData.killedNames.join(', ')}.` : 'Этой ночью никто не погиб.'}
                                            </span>
                                        </div>

                                        {briefingData?.reports?.length > 0 && (
                                            <div className="pt-8 border-t border-white/10 space-y-4">
                                                <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-indigo-950/60 border border-indigo-500/30 rounded-full">
                                                    <Icon name="Shield" size={14} className="text-indigo-400"/>
                                                    <span className="text-[10px] font-black text-indigo-300 uppercase tracking-[0.2em]">Детали ночи (Для ведущего)</span>
                                                </div>
                                                <div className="grid gap-3">
                                                    {briefingData.reports.map((report, idx) => {
                                                        const isBlock = report.includes('ЗАБЛОКИРОВАН') || report.includes('[В БЛОКЕ]') || report.includes('погибла вместе');
                                                        return (
                                                            <div key={idx} className={`p-4 sm:p-5 rounded-2xl border font-bold text-sm sm:text-base flex items-center gap-4 ${isBlock ? 'bg-rose-950/50 border-rose-500/40 text-rose-200' : 'bg-indigo-950/50 border-indigo-500/40 text-indigo-200'}`}>
                                                                <Icon name={isBlock ? "Lock" : "Eye"} size={20} className="shrink-0" />
                                                                <span>{report}</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= 7. ФИНАЛ ИГРЫ ================= */}
                        {phase === PHASES.GAME_OVER && (
                            <div className="max-w-4xl mx-auto w-full flex flex-col items-center justify-center animate-fade-in pt-10 flex-1 text-center">
                                <div className="relative mb-10 animate-float">
                                    <div className={`p-10 rounded-[3rem] omni-glass border ${winner === 'Победа Мафии' ? 'border-rose-500/60 text-rose-500' : 'border-emerald-500/60 text-emerald-500'}`}>
                                        <Icon name="Trophy" size={110} />
                                    </div>
                                </div>
                                
                                <h1 className={`text-5xl sm:text-7xl font-black mb-12 uppercase tracking-tight ${
                                    winner === 'Победа Мафии' ? 'text-rose-400' : winner === 'Победа Мирных' ? 'text-emerald-400' : 'text-white'
                                }`}>
                                    {winner}
                                </h1>

                                <div className="w-full omni-glass rounded-[2.5rem] p-8 border border-white/10">
                                    <h3 className="text-left text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Итоговый список ролей</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                                        {players.map(p => (
                                            <div key={p.id} className="bg-slate-900/80 p-4 rounded-2xl flex items-center justify-between border border-white/5">
                                                <div className="flex items-center gap-3">
                                                    <span className="font-tech text-xs text-slate-400 bg-black/40 px-2.5 py-1 rounded-lg">#{p.id}</span>
                                                    <span className={`font-black text-base ${p.isAlive ? 'text-white' : 'text-slate-500 line-through'}`}>{p.name}</span>
                                                </div>
                                                <span className={`text-[10px] font-black uppercase px-3 py-1 rounded-lg border ${ROLES[p.role].bg} ${ROLES[p.role].color} ${ROLES[p.role].border}`}>
                                                    {ROLES[p.role].name}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                    </div>

                    {/* ================= НИЖНЯЯ ДОК-ПАНЕЛЬ УПРАВЛЕНИЯ ФАЗАМИ ================= */}
                    {phase !== PHASES.SETUP && phase !== PHASES.DISTRIBUTION && phase !== PHASES.NAME_SETUP && (
                        <div className="fixed bottom-0 inset-x-0 pb-6 pt-10 px-4 bg-gradient-to-t from-black via-black/90 to-transparent z-[100] pointer-events-none flex justify-center">
                            <div className="pointer-events-auto max-w-2xl w-full">
                                
                                {phase === PHASES.DAY && (
                                    <button onClick={endDay} className={`w-full py-5 sm:py-6 rounded-full font-black text-lg sm:text-xl tracking-[0.2em] uppercase transition-all transform active:scale-95 shadow-2xl border flex items-center justify-center gap-3 ${
                                        nominations.length > 0 ? 'bg-gradient-to-r from-rose-700 to-rose-500 text-white border-rose-400 shadow-[0_15px_40px_rgba(225,29,72,0.45)]' : 'bg-white text-slate-950 border-white shadow-[0_15px_40px_rgba(255,255,255,0.25)]'
                                    }`}>
                                        <Icon name={nominations.length > 0 ? "Crosshair" : "Moon"} size={24} />
                                        <span>{nominations.length > 0 ? `Голосование (${nominations.length} канд.)` : 'Объявить Ночь'}</span>
                                    </button>
                                )}

                                {phase === PHASES.VOTING && (
                                    <button onClick={calculateVoting} className="w-full py-5 sm:py-6 rounded-full bg-gradient-to-r from-rose-700 to-rose-500 text-white font-black text-lg sm:text-xl tracking-[0.2em] uppercase transition-all transform active:scale-95 shadow-[0_15px_40px_rgba(225,29,72,0.5)] border border-rose-400 flex items-center justify-center gap-3">
                                        <Icon name="Check" size={24} />
                                        <span>Зафиксировать итог суда</span>
                                    </button>
                                )}

                                {phase === PHASES.NIGHT && (
                                    <button onClick={() => handleNightAction(null)} disabled={!!nightAnim} className="w-full py-5 sm:py-6 rounded-full bg-slate-900/95 hover:bg-slate-800 text-white font-black text-lg sm:text-xl tracking-[0.2em] uppercase transition-all transform active:scale-95 shadow-2xl border border-white/20 disabled:opacity-40">
                                        Пропустить ход роли
                                    </button>
                                )}

                                {phase === PHASES.BRIEFING && (
                                    <button onClick={() => {
                                        saveToHistory();
                                        haptic('medium');
                                        triggerSound('select');
                                        if (briefingData?.gameOver) { setWinner(briefingData.gameOver); setPhase(PHASES.GAME_OVER); } 
                                        else { setDayCount(d => d + 1); setPhase(PHASES.DAY); }
                                    }} className="w-full py-5 sm:py-6 rounded-full bg-gradient-to-r from-emerald-600 to-emerald-400 text-slate-950 font-black text-lg sm:text-xl tracking-[0.2em] uppercase transition-all transform active:scale-95 shadow-[0_15px_40px_rgba(16,185,129,0.4)] border border-emerald-300 flex items-center justify-center gap-3">
                                        <Icon name={briefingData?.gameOver ? "Trophy" : "Sun"} size={24} />
                                        <span>{briefingData?.gameOver ? 'Показать Финал' : `Начать День ${dayCount + 1}`}</span>
                                    </button>
                                )}

                                {phase === PHASES.GAME_OVER && (
                                    <button onClick={() => {haptic('light'); triggerSound('select'); setPhase(PHASES.SETUP);}} className="w-full py-5 sm:py-6 rounded-full bg-white text-slate-950 font-black text-lg sm:text-xl tracking-[0.2em] uppercase transition-all transform active:scale-95 shadow-[0_15px_40px_rgba(255,255,255,0.25)] border border-white flex items-center justify-center gap-3">
                                        <Icon name="RotateCcw" size={24} className="text-indigo-600" />
                                        <span>Новая Партия</span>
                                    </button>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MafiaOS />);
    </script>
</body>
</html>
