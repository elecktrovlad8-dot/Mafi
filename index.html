    <style>

        body {

            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;

            background: rgba(11, 15, 29, 0.72);

                box-shadow: 0 15px 35px -10px rgba(99, 102, 241, 0.25);

        const { useState, useEffect, useRef, useMemo } = React;

        // 🎵 БЛОК НАСТРОЙКИ МУЗЫКИ (ВСТАВЬТЕ СЮДА ПУТИ К ВАШИМ АУДИОФАЙЛАМ)
        // Также вы можете выбрать файлы прямо внутри приложения через кнопку "Аудиотека"!
        // ============================================================================
        const AUDIO_FILES_CONFIG = {
            // 1. Фоновая музыка (играет на протяжении всей игры, зациклена)
            BACKGROUND: {
                title: 'Фоновая атмосфера (Постоянная)',

            BEAUTY: {

            },
            MAFIA_GROUP: {

            },

            SHERIFF: {

        // Синтезатор интерфейсных звуков (SFX)
        const playOmniSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                
                const createOsc = (freq, vStart, vEnd, dur, wave='sine') => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = wave;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(vStart, now);
                    gain.gain.exponentialRampToValueAtTime(vEnd, now + dur);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                };

                switch (type) {
                    case 'hologram':
                        createOsc(880, 0.06, 0.001, 0.14, 'sine');
                        createOsc(1760, 0.03, 0.001, 0.18, 'sine');
                        break;
                    case 'select':
                    case 'click':
                        createOsc(460, 0.04, 0.001, 0.08, 'triangle');
                        break;
                    case 'flip':
                        createOsc(320, 0.07, 0.001, 0.25, 'triangle');
                        createOsc(640, 0.04, 0.001, 0.3, 'sine');
                        break;
                    case 'danger':
                    case 'no':
                        createOsc(110, 0.12, 0.001, 0.35, 'sawtooth');
                        createOsc(55, 0.12, 0.001, 0.45, 'square');
                        break;
                    case 'success':
                    case 'yes':
                        createOsc(587.33, 0.08, 0.001, 0.25, 'sine');
                        setTimeout(() => createOsc(880, 0.09, 0.001, 0.35, 'sine'), 90);
                        break;
                    case 'night_start':
                        createOsc(160, 0.08, 0.001, 2.2, 'sine');
                        createOsc(80, 0.08, 0.001, 2.8, 'triangle');
                        break;
                    case 'distribute':
                        for(let i = 0; i < 7; i++) {
                            setTimeout(() => createOsc(650 + (i * 110), 0.03, 0.001, 0.09, 'sine'), i * 100);
                        }
                        break;
                    case 'victory':
                        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                            setTimeout(() => createOsc(f, 0.09, 0.001, 0.55, 'sine'), i * 160);
                        });
                        break;
                }
            } catch(e) {}
        };

        const haptic = (intensity = 'light') => {
            if (!navigator.vibrate) return;
            try {
                if (intensity === 'light') navigator.vibrate(10);
                if (intensity === 'medium') navigator.vibrate(25);
                if (intensity === 'heavy') navigator.vibrate([45, 35, 45]);
                if (intensity === 'pulse') navigator.vibrate([15, 40, 15, 40, 20]);
                if (intensity === 'distribute') navigator.vibrate([15, 40, 15, 40, 15, 40]);

        const Icon = ({ name, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: iconsPaths[name] || iconsPaths.Sparkles }} />
        );

        const ROLES = {
            CITIZEN: { id: 'CITIZEN', name: 'Мирный', color: 'text-slate-200', bg: 'bg-slate-500/20', border: 'border-slate-400/40', glow: 'shadow-slate-400/20', accent: 'from-slate-500/20' },
            MAFIA:   { id: 'MAFIA',   name: 'Мафия',  color: 'text-rose-400',  bg: 'bg-rose-900/40',  border: 'border-rose-500/50',  glow: 'shadow-rose-500/40',  accent: 'from-rose-600/30' },

            SHERIFF: { id: 'SHERIFF', name: 'Шериф',  color: 'text-amber-400', bg: 'bg-amber-900/40', border: 'border-amber-500/50', glow: 'shadow-amber-500/40', accent: 'from-amber-500/30' },
            DOCTOR:  { id: 'DOCTOR',  name: 'Доктор', color: 'text-emerald-400',bg: 'bg-emerald-900/40',border: 'border-emerald-500/50',glow: 'shadow-emerald-500/40',accent: 'from-emerald-500/30' },

            BEAUTY:  { id: 'BEAUTY',  name: 'Красотка',color: 'text-fuchsia-400',bg: 'bg-fuchsia-900/40',border: 'border-fuchsia-500/50',glow: 'shadow-fuchsia-500/40',accent: 'from-fuchsia-500/30' },
        };

        const PHASES = {
            SETUP: 'SETUP',
            DISTRIBUTION: 'DISTRIBUTION',
            NAME_SETUP: 'NAME_SETUP',
            DAY: 'DAY',
            VOTING: 'VOTING',
            NIGHT: 'NIGHT',
            BRIEFING: 'BRIEFING',
            GAME_OVER: 'GAME_OVER'
        };

        function MafiaOS() {
            const [phase, setPhase] = useState(PHASES.SETUP);
            const [dayCount, setDayCount] = useState(1);
            const [players, setPlayers] = useState([]);
            
            const [deck, setDeck] = useState({ 
                MAFIA: 2, CITIZEN: 6, 
                DON: 1, SHERIFF: 1, DOCTOR: 0, MANIAC: 0, BEAUTY: 0 
            });

            const totalPlayers = Object.values(deck).reduce((a, b) => a + b, 0);

            const [nominations, setNominations] = useState([]);
            const [votes, setVotes] = useState({});
            const [nightActions, setNightActions] = useState({});
            const [nightStep, setNightStep] = useState(0);
            const [briefingData, setBriefingData] = useState(null);
            const [winner, setWinner] = useState(null);
            const [speakerId, setSpeakerId] = useState(null);
            const [hideRolesInSetup, setHideRolesInSetup] = useState(false);
            
            // Временная анимация выбора ночью (YES, NO, BLOCKED, SELECTED)
            const [nightAnim, setNightAnim] = useState(null); 
            
            // ================= АУДИО СИСТЕМА (ФОН + РОЛИ + SFX) =================
            const [tracks, setTracks] = useState(AUDIO_FILES_CONFIG);
            const [bgMusicEnabled, setBgMusicEnabled] = useState(true);
            const [roleMusicEnabled, setRoleMusicEnabled] = useState(true);
            const [sfxEnabled, setSfxEnabled] = useState(true);
            
            const [bgVolume, setBgVolume] = useState(0.35);
            const [roleVolume, setRoleVolume] = useState(0.85);
            const [showAudioStudio, setShowAudioStudio] = useState(false);
            const [activeRoleTrackKey, setActiveRoleTrackKey] = useState(null);
            const [previewTrackKey, setPreviewTrackKey] = useState(null);

            const bgAudioRef = useRef(null);
            const roleAudioRef = useRef(null);

            const [showLog, setShowLog] = useState(false);
            const [gameLog, setGameLog] = useState([]);

            const [timeLeft, setTimeLeft] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const timerRef = useRef(null);
            const maxTimeRef = useRef(60);
            
            const [history, setHistory] = useState([]);

            const triggerSound = (type) => { if (sfxEnabled) playOmniSound(type); };

            // Инициализация аудио-объектов
            useEffect(() => {
                bgAudioRef.current = new Audio();
                bgAudioRef.current.loop = true;
                roleAudioRef.current = new Audio();
                roleAudioRef.current.loop = true;

                return () => {
                    bgAudioRef.current?.pause();
                    roleAudioRef.current?.pause();
                };
            }, []);

            // Управление Фоновой Музыкой + Auto-Ducking (приглушение фона, когда играет музыка роли)
            useEffect(() => {
                const bgAudio = bgAudioRef.current;
                if (!bgAudio) return;

                const currentSrc = tracks.BACKGROUND?.src;
                if (bgAudio.getAttribute('data-src') !== currentSrc && currentSrc) {
                    bgAudio.src = currentSrc;
                    bgAudio.setAttribute('data-src', currentSrc);
                }

                // Если ночью играет музыка роли, приглушаем фоновую музыку в 3 раза
                const isRolePlayingNow = (phase === PHASES.NIGHT && roleMusicEnabled) || previewTrackKey;
                bgAudio.volume = isRolePlayingNow ? Math.max(0.05, bgVolume * 0.25) : bgVolume;

                if (bgMusicEnabled && currentSrc) {
                    bgAudio.play().catch(() => {});
                } else {
                    bgAudio.pause();
                }
            }, [bgMusicEnabled, bgVolume, tracks.BACKGROUND, phase, roleMusicEnabled, previewTrackKey]);

            // Управление Музыкой Ролей ночью
            const getActiveNightRoles = () => {
                const active = [];
                const hasAlive = (roleId) => players.some(p => p.role === roleId && p.isAlive);
                
                if (hasAlive('BEAUTY')) active.push({ role: 'BEAUTY', action: 'Просыпается Красотка', desc: 'Блокирует способность игрока (алиби не дает)', color: 'fuchsia' });
                if (hasAlive('MAFIA') || hasAlive('DON')) active.push({ role: 'MAFIA_GROUP', action: 'Охота Мафии', desc: 'Единый выстрел клана', color: 'rose' });
                if (hasAlive('MANIAC')) active.push({ role: 'MANIAC', action: 'Просыпается Маньяк', desc: 'Одиночный выстрел в ночи', color: 'orange' });
                if (hasAlive('DOCTOR')) active.push({ role: 'DOCTOR', action: 'Дежурство Доктора', desc: 'Спасение от смертельного ранения', color: 'emerald' });
                if (hasAlive('SHERIFF')) active.push({ role: 'SHERIFF', action: 'Проверка Шерифа', desc: 'Поиск представителей мафии', color: 'amber' });
                if (hasAlive('DON')) active.push({ role: 'DON', action: 'Проверка Дона', desc: 'Поиск Шерифа города', color: 'red' });
                return active;
            };

            const nightOrder = getActiveNightRoles();

            useEffect(() => {
                const roleAudio = roleAudioRef.current;
                if (!roleAudio) return;

                roleAudio.volume = roleVolume;

                // Если включено прослушивание в Аудио-Студии
                if (previewTrackKey && tracks[previewTrackKey]?.src) {
                    if (roleAudio.getAttribute('data-src') !== tracks[previewTrackKey].src) {
                        roleAudio.src = tracks[previewTrackKey].src;
                        roleAudio.setAttribute('data-src', tracks[previewTrackKey].src);
                    }
                    roleAudio.play().catch(() => {});
                    setActiveRoleTrackKey(previewTrackKey);
                    return;
                }

                // Если идет НОЧЬ и музыка ролей ВКЛЮЧЕНА
                if (phase === PHASES.NIGHT && roleMusicEnabled && nightOrder.length > 0 && nightOrder[nightStep]) {
                    const roleKey = nightOrder[nightStep].role;
                    const trackSrc = tracks[roleKey]?.src;
                    setActiveRoleTrackKey(roleKey);

                    if (trackSrc) {
                        if (roleAudio.getAttribute('data-src') !== trackSrc) {
                            roleAudio.src = trackSrc;
                            roleAudio.setAttribute('data-src', trackSrc);
                        }
                        roleAudio.currentTime = 0;
                        roleAudio.play().catch(() => {});
                    } else {
                        roleAudio.pause();
                    }
                } else {
                    roleAudio.pause();
                    setActiveRoleTrackKey(null);
                }
            }, [phase, nightStep, roleMusicEnabled, roleVolume, tracks, previewTrackKey, players]);

            // Загрузка пользовательского аудиофайла прямо в браузере
            const handleFileUpload = (trackKey, event) => {
                const file = event.target.files?.[0];
                if (!file) return;
                const objectUrl = URL.createObjectURL(file);
                setTracks(prev => ({
                    ...prev,
                    [trackKey]: {
                        ...prev[trackKey],
                        src: objectUrl,
                        fileName: file.name
                    }
                }));
                haptic('medium');
                triggerSound('success');
            };

            const logEvent = (text, type = 'info') => {
                const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                setGameLog(prev => [{ id: Date.now() + Math.random(), day: dayCount, text, type, time }, ...prev]);
            };

            const saveToHistory = () => {
                const currentState = JSON.stringify({ phase, dayCount, players, nominations, votes, nightActions, nightStep, briefingData, winner, gameLog });
                setHistory(prev => [...prev.slice(-40), currentState]);
            };

            const undo = () => {
                if (history.length === 0) return;
                haptic('medium');
                triggerSound('select');
                const s = JSON.parse(history[history.length - 1]);
                setPhase(s.phase); setDayCount(s.dayCount); setPlayers(s.players);
                setNominations(s.nominations); setVotes(s.votes); setNightActions(s.nightActions);
                setNightStep(s.nightStep); setBriefingData(s.briefingData); setWinner(s.winner); setGameLog(s.gameLog);
                setHistory(prev => prev.slice(0, -1));
            };

            const stats = useMemo(() => {
                const alive = players.filter(p => p.isAlive);
                const mafia = alive.filter(p => p.role === 'MAFIA' || p.role === 'DON').length;
                const city = alive.length - mafia;
                return { alive: alive.length, mafia, city, total: players.length };
            }, [players]);

            const checkWin = (currentPlayers) => {
                const alive = currentPlayers.filter(p => p.isAlive);
                if (alive.length === 0) return 'Ничья (Все мертвы)';
                const mafia = alive.filter(p => p.role === 'MAFIA' || p.role === 'DON').length;
                const city = alive.length - mafia;
                if (mafia === 0) return 'Победа Мирных';
                if (mafia >= city) return 'Победа Мафии';
                return null;
            };

            const autoBalance = () => {
                haptic('medium');
                triggerSound('hologram');
                const total = Math.max(5, totalPlayers);
                const mafiaCount = Math.floor(total / 3);
                
                const don = deck.DON > 0 ? 1 : 0;
                const sheriff = deck.SHERIFF > 0 ? 1 : 0;
                const doctor = deck.DOCTOR > 0 ? 1 : 0;
                const maniac = deck.MANIAC > 0 ? 1 : 0;
                const beauty = deck.BEAUTY > 0 ? 1 : 0;
                
                const mafia = Math.max(1, mafiaCount - don);
                const citizens = Math.max(1, total - (mafia + don + sheriff + doctor + maniac + beauty));
                
                setDeck({ MAFIA: mafia, CITIZEN: citizens, DON: don, SHERIFF: sheriff, DOCTOR: doctor, MANIAC: maniac, BEAUTY: beauty });
            };

            const buildShuffledPlayers = (existingNames = []) => {
                const rolePool = [];
                Object.entries(deck).forEach(([role, count]) => {
                    for (let i = 0; i < count; i++) rolePool.push(role);
                });
                
                for (let i = rolePool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]];
                }

                return rolePool.map((role, idx) => ({
                    id: idx + 1,
                    name: existingNames[idx] || `Игрок ${idx + 1}`,
                    role,
                    isAlive: true,
                    isExposed: false,
                    fouls: 0,
                    knownToSheriff: false,
                    knownToDon: false
                }));
            };

            const startGame = () => {
                if (totalPlayers < 3) return;
                haptic('distribute');
                triggerSound('distribute');
                
                // Разблокируем аудиоконтекст браузера при первом клике
                if (bgMusicEnabled && bgAudioRef.current && tracks.BACKGROUND?.src) {
                    bgAudioRef.current.play().catch(() => {});
                }

                setPlayers(buildShuffledPlayers());
                setPhase(PHASES.DISTRIBUTION);
                setHistory([]);
                setGameLog([]);
                logEvent('Генерация ролей завершена. Матрица загружена.', 'system');

                setTimeout(() => {
                    setPhase(PHASES.NAME_SETUP);
                    haptic('medium');
                }, 2600);
            };

            const reshuffleRolesInSetup = () => {
                haptic('distribute');
                triggerSound('distribute');
                const currentNames = players.map(p => p.name);
                setPlayers(buildShuffledPlayers(currentNames));
            };
            
            const beginDayOne = () => {
                haptic('heavy');
                setPhase(PHASES.DAY);
                setDayCount(1);
                setWinner(null);
                triggerSound('night_start');
                logEvent('День 1. Город просыпается.', 'info');
            };

            const handleNameChange = (id, newName) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            const addFoul = (id) => {
                haptic('light');
                triggerSound('select');
                setPlayers(prev => prev.map(p => {
                    if (p.id !== id) return p;
                    const nextFouls = (p.fouls + 1) % 5;
                    if (nextFouls === 4) {
                        logEvent(`${p.name} получает 4-й фол (Удаление)!`, 'danger');
                    } else if (nextFouls > 0) {
                        logEvent(`${p.name} получает фол (${nextFouls}/4)`, 'warning');
                    }
                    return { ...p, fouls: nextFouls };
                }));
            };

            const cyclePlayerStatus = (id) => {
                saveToHistory();
                haptic('heavy');
                triggerSound('danger');
                setPlayers(prev => prev.map(p => {
                    if (p.id !== id) return p;
                    const nextAlive = !p.isAlive;
                    logEvent(`${p.name} (#${p.id}) статус изменен: ${nextAlive ? 'В игре' : 'Покинул стол'}`, nextAlive ? 'success' : 'danger');
                    return { ...p, isAlive: nextAlive, isExposed: !nextAlive ? true : p.isExposed };
                }));
            };

            useEffect(() => {
                if (isTimerRunning && timeLeft > 0) {
                    timerRef.current = setTimeout(() => {
                        setTimeLeft(prev => {
                            if (prev <= 10 && prev > 1) {
                                triggerSound('select');
                                haptic('light');
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (timeLeft === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    haptic('heavy');
                    triggerSound('danger');
                }
                return () => clearTimeout(timerRef.current);
            }, [timeLeft, isTimerRunning]);

            const startTimer = (secs, spkId = null) => {
                haptic('light');
                triggerSound('hologram');
                maxTimeRef.current = secs;
                setTimeLeft(secs);
                setIsTimerRunning(true);
                if (spkId !== null) setSpeakerId(spkId);
            };

            const toggleSpeaker = (id) => {
                haptic('light');
                triggerSound('select');
                if (speakerId === id) {
                    setSpeakerId(null);
                    setIsTimerRunning(false);
                } else {
                    startTimer(60, id);
                }
            };

            const nextAliveSpeaker = () => {
                const alivePlayers = players.filter(p => p.isAlive);
                if (alivePlayers.length === 0) return;
                if (!speakerId) {
                    startTimer(60, alivePlayers[0].id);
                    return;
                }
                const idx = alivePlayers.findIndex(p => p.id === speakerId);
                const nextPlayer = alivePlayers[(idx + 1) % alivePlayers.length];
                startTimer(60, nextPlayer.id);
            };

            const toggleNomination = (playerId) => {
                haptic('medium');
                triggerSound('select');
                setNominations(prev => {
                    if (prev.includes(playerId)) return prev.filter(id => id !== playerId);
                    const p = players.find(x => x.id === playerId);
                    logEvent(`Выставлена кандидатура: #${p?.id} ${p?.name}`, 'warning');
                    return [...prev, playerId];
                });
            };

            const endDay = () => {
                saveToHistory();
                haptic('medium');
                triggerSound('select');
                setSpeakerId(null);
                setIsTimerRunning(false);
                if (nominations.length > 0) {
                    setPhase(PHASES.VOTING);
                    const initialVotes = {};
                    nominations.forEach(id => initialVotes[id] = 0);
                    setVotes(initialVotes);
                    logEvent(`Начало голосования. Кандидатов: ${nominations.length}`, 'system');
                } else {
                    logEvent('Кандидатур нет. Город уходит в ночь.', 'night');
                    startNight();
                }
            };

            const addVote = (playerId, delta) => {
                haptic('light');
                triggerSound('select');
                const aliveCount = stats.alive;
                const currentTotal = Object.values(votes).reduce((a, b) => a + b, 0);
                
                setVotes(prev => {
                    const newVal = Math.max(0, (prev[playerId] || 0) + delta);
                    if (delta > 0 && currentTotal >= aliveCount) return prev; 
                    return { ...prev, [playerId]: newVal };
                });
            };

            const calculateVoting = () => {
                saveToHistory();
                haptic('pulse');
                triggerSound('danger');
                const maxVotes = Math.max(...Object.values(votes));
                const leaders = Object.keys(votes).filter(id => votes[id] === maxVotes).map(Number);

                if (leaders.length === 1 && maxVotes > 0) {
                    const victim = players.find(p => p.id === leaders[0]);
                    const newPlayers = players.map(p => p.id === leaders[0] ? { ...p, isAlive: false, isExposed: true } : p);
                    setPlayers(newPlayers);
                    setNominations([]);
                    logEvent(`По итогам голосования город покидает: ${victim.name} (${ROLES[victim.role].name}) [${maxVotes} гол.]`, 'danger');
                    
                    const win = checkWin(newPlayers);
                    if (win) {
                        setWinner(win);
                        triggerSound('victory');
                        logEvent(win, 'success');
                        setPhase(PHASES.GAME_OVER);
                    } else {
                        startNight();
                    }
                } else if (maxVotes === 0) {
                    setNominations([]);
                    logEvent('Голоса не распределены. Город засыпает.', 'info');
                    startNight();
                } else {
                    setNominations(leaders);
                    const newVotes = {};
                    leaders.forEach(id => newVotes[id] = 0);
                    setVotes(newVotes);
                    logEvent(`Автокатастрофа (равенство голосов по ${maxVotes}). Перестрелка!`, 'warning');
                }
            };

            const startNight = () => {
                setPhase(PHASES.NIGHT);
                setNightActions({});
                setNightStep(0);
                setNominations([]);
                triggerSound('night_start');
                logEvent(`Наступает Ночь ${dayCount}`, 'night');
            };

            // ================= НОЧНОЙ ВЫБОР И ПРОВЕРКИ =================
            const handleNightAction = (targetId) => {
                if (nightAnim) return; // Защита от двойного нажатия во время анимации
                
                haptic('medium');
                
                const currentRoleKey = nightOrder[nightStep].role;
                const newActions = { ...nightActions, [currentRoleKey]: targetId };
                
                // Пропуск хода
                if (!targetId) {
                    triggerSound('select');
                    proceedNextNightStep(newActions);
                    return;
                }

                const actor = players.find(p => p.role === currentRoleKey && p.isAlive);
                const targetPlayer = players.find(p => p.id === targetId);

                // Если действует Шериф или Дон -> показываем результат проверки или БЛОК
                if (currentRoleKey === 'SHERIFF' || currentRoleKey === 'DON') {
                    const isBlocked = newActions['BEAUTY'] === actor?.id;
                    
                    let resultStatus = '';
                    if (isBlocked) {
                        resultStatus = 'BLOCKED';
                        triggerSound('danger');
                        haptic('heavy');
                    } else {
                        if (currentRoleKey === 'SHERIFF') {
                            resultStatus = (targetPlayer.role === 'MAFIA' || targetPlayer.role === 'DON') ? 'YES' : 'NO';
                        } else {
                            resultStatus = (targetPlayer.role === 'SHERIFF') ? 'YES' : 'NO';
                        }
                        triggerSound(resultStatus === 'YES' ? 'yes' : 'no');
                    }
                    
                    setNightAnim({ targetId, status: resultStatus });
                    
                    setTimeout(() => {
                        setNightAnim(null);
                        proceedNextNightStep(newActions);
                    }, 2200);
                    
                } else {
                    // Для Красотки, Мафии, Маньяка, Доктора -> быстрая вспышка подтверждения и сброс кнопки
                    triggerSound('select');
                    setNightAnim({ targetId, status: 'SELECTED' });
                    
                    setTimeout(() => {
                        setNightAnim(null);
                        proceedNextNightStep(newActions);
                    }, 650);
                }
            };

            const proceedNextNightStep = (newActions) => {
                setNightActions(newActions);
                if (nightStep + 1 < nightOrder.length) setNightStep(prev => prev + 1);
                else finishNight(newActions);
            };

            // ================= ПОДСЧЕТ ИТОГОВ НОЧИ (С НОВОЙ ЛОГИКОЙ КРАСОТКИ) =================
            const finishNight = (actions) => {
                saveToHistory();
                haptic('heavy');
                let killed = [];
                let saved = [];
                let reports = [];
                let blockedRoles = [];

                const beautyTargetId = actions['BEAUTY'];
                const beautyPlayer = players.find(p => p.role === 'BEAUTY' && p.isAlive);

                // 1. Красотка ТОЛЬКО блокирует способность (алиби/лечение НЕ дает!)
                if (beautyTargetId) {
                    const target = players.find(p => p.id === beautyTargetId);
                    if (target) {
                        if (target.role === 'MAFIA' || target.role === 'DON') blockedRoles.push('MAFIA_GROUP');
                        if (target.role === 'DON') blockedRoles.push('DON');
                        if (target.role === 'SHERIFF') blockedRoles.push('SHERIFF');
                        if (target.role === 'DOCTOR') blockedRoles.push('DOCTOR');
                        if (target.role === 'MANIAC') blockedRoles.push('MANIAC');
                        reports.push(`КРАСОТКА: Посетила игрока [#${target.id}] ${target.name} (Роль заблокирована)`);
                    }
                }

                // 2. Доктор спасает от убийства (если сам Доктор не заблокирован Красоткой)
                if (actions['DOCTOR']) {
                    if (blockedRoles.includes('DOCTOR')) {
                        reports.push(`СИСТЕМА: Доктор был заблокирован Красоткой и никого не вылечил!`);
                    } else {
                        saved.push(actions['DOCTOR']);
                    }
                }
                
                // 3. Выстрел Мафии
                if (actions['MAFIA_GROUP']) {
                    if (blockedRoles.includes('MAFIA_GROUP')) {
                        reports.push(`СИСТЕМА: Красотка выбрала мафию — выстрел клана Мафии ЗАБЛОКИРОВАН!`);
                    } else if (!saved.includes(actions['MAFIA_GROUP'])) {
                        killed.push(actions['MAFIA_GROUP']);
                    } else {
                        reports.push(`СИСТЕМА: Доктор спас цель от выстрела Мафии!`);
                    }
                }

                // 4. Выстрел Маньяка
                if (actions['MANIAC']) {
                    if (blockedRoles.includes('MANIAC')) {
                        reports.push(`СИСТЕМА: Маньяк был заблокирован Красоткой!`);
                    } else if (!saved.includes(actions['MANIAC'])) {
                        killed.push(actions['MANIAC']);
                    } else {
                        reports.push(`СИСТЕМА: Доктор спас цель от Маньяка!`);
                    }
                }

                // 5. Смерть Красотки при убийстве того, к кому она пришла в дом
                if (beautyTargetId && beautyPlayer) {
                    if (killed.includes(beautyTargetId) && !killed.includes(beautyPlayer.id)) {
                        // Если саму Красотку случайно не лечил Доктор в эту же ночь
                        if (!saved.includes(beautyPlayer.id)) {
                            killed.push(beautyPlayer.id);
                            const victimObj = players.find(p => p.id === beautyTargetId);
                            reports.push(`СИСТЕМА: Красотка (${beautyPlayer.name}) находилась в доме жертвы (${victimObj?.name}) и погибла вместе с ней!`);
                        }
                    }
                }

                let nextPlayers = [...players];

                // 6. Результаты проверок Шерифа и Дона
                if (actions['SHERIFF']) {
                    if (blockedRoles.includes('SHERIFF')) {
                        reports.push(`ШЕРИФ: [В БЛОКЕ] Проверка не состоялась из-за визита Красотки.`);
                    } else {
                        const p = nextPlayers.find(p => p.id === actions['SHERIFF']);
                        if (p) {
                            const isMafia = p.role === 'MAFIA' || p.role === 'DON';
                            reports.push(`ШЕРИФ: Проверил [#${p.id}] ${p.name} — ${isMafia ? '👍 ЧЕРНЫЙ (МАФИЯ)' : '👎 КРАСНЫЙ (МИРНЫЙ)'}`);
                            nextPlayers = nextPlayers.map(pl => pl.id === p.id ? { ...pl, knownToSheriff: true } : pl);
                        }
                    }
                }
                
                if (actions['DON']) {
                    if (blockedRoles.includes('DON')) {
                        reports.push(`ДОН: [В БЛОКЕ] Проверка не состоялась из-за визита Красотки.`);
                    } else {
                        const p = nextPlayers.find(p => p.id === actions['DON']);
                        if (p) {
                            const isSheriff = p.role === 'SHERIFF';
                            reports.push(`ДОН: Проверил [#${p.id}] ${p.name} — ${isSheriff ? '👍 ДА (ШЕРИФ)' : '👎 НЕТ (НЕ ШЕРИФ)'}`);
                            nextPlayers = nextPlayers.map(pl => pl.id === p.id ? { ...pl, knownToDon: true } : pl);
                        }
                    }
                }

                const uniqueKilled = [...new Set(killed)];
                nextPlayers = nextPlayers.map(p => uniqueKilled.includes(p.id) ? { ...p, isAlive: false, isExposed: true } : p);
                setPlayers(nextPlayers);
                
                const killedNames = uniqueKilled.map(id => {
                    const pl = nextPlayers.find(p => p.id === id);
                    return pl ? `#${pl.id} ${pl.name}` : '';
                });

                if (killedNames.length > 0) {
                    logEvent(`Убиты ночью: ${killedNames.join(', ')}`, 'danger');
                } else {
                    logEvent('Ночь прошла без жертв.', 'success');
                }
                reports.forEach(r => logEvent(r, 'night'));

                const win = checkWin(nextPlayers);
                if (win) triggerSound('victory');
                
                setBriefingData({ killedNames, reports, gameOver: win });
                setPhase(PHASES.BRIEFING);
            };

            // Проверка для подсказки ведущему: заблокирована ли текущая ночная роль Красоткой
            const isCurrentNightRoleBlocked = useMemo(() => {
                if (phase !== PHASES.NIGHT || !nightOrder[nightStep]) return false;
                const bId = nightActions['BEAUTY'];
                if (!bId) return false;
                const bTarget = players.find(p => p.id === bId);
                if (!bTarget) return false;
                const curRole = nightOrder[nightStep].role;
                if (curRole === 'MAFIA_GROUP' && (bTarget.role === 'MAFIA' || bTarget.role === 'DON')) return true;
                if (curRole === bTarget.role) return true;
                return false;
            }, [phase, nightStep, nightActions, players]);

            return (
                <div className="min-h-screen pb-40 font-sans relative">
                    {/* АТМОСФЕРНЫЙ ФОН */}
                    <div className="fixed inset-0 pointer-events-none z-[-1] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 bg-grid opacity-30" />
                        <div className={`absolute w-[95vw] h-[95vw] rounded-full blur-[150px] transition-colors duration-1000 opacity-20 ${
                            phase === PHASES.NIGHT ? 'bg-indigo-900' : phase === PHASES.VOTING ? 'bg-rose-900' : 'bg-indigo-600'
                        } animate-spin-slow`} />
                        <div className={`absolute right-[-20%] bottom-[-20%] w-[75vw] h-[75vw] rounded-full blur-[130px] transition-colors duration-1000 opacity-20 ${
                            phase === PHASES.NIGHT ? 'bg-fuchsia-900' : 'bg-rose-600'
                        }`} />
                    </div>

                    {/* ================= МОДАЛЬНОЕ ОКНО: АУДИО-СТУДИЯ ================= */}
                    {showAudioStudio && (
                        <div className="fixed inset-0 z-[250] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
